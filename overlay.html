<!doctype html><html lang="es"><meta charset="utf-8"><title>HUD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#F5F3FB;user-select:none}
.hud{margin:8px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:14px;border-radius:26px;background:linear-gradient(135deg,rgba(30,24,50,.88),rgba(21,17,31,.88));border:1px solid rgba(185,155,255,.35);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;backdrop-filter:blur(14px);animation:in .6s cubic-bezier(.2,1.3,.4,1) both;-webkit-app-region:no-drag}
body.mv .hud{-webkit-app-region:drag;border-color:#2BD67B;box-shadow:0 0 0 3px rgba(43,214,123,.35),0 14px 40px rgba(0,0,0,.55)}
@keyframes in{from{transform:translateY(-16px) scale(.9);opacity:0}}
.ring{position:relative;width:76px;height:76px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.t{fill:none;stroke:rgba(255,255,255,.12);stroke-width:8}.p{fill:none;stroke:url(#g);stroke-width:8;stroke-linecap:round;stroke-dasharray:263.9;stroke-dashoffset:263.9;transition:stroke-dashoffset .9s cubic-bezier(.3,1,.4,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.live .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,214,123,.5)}100%{box-shadow:0 0 0 18px rgba(43,214,123,0)}}
.i{min-width:0}.pz{font-size:26px;font-weight:800;line-height:1;background:linear-gradient(90deg,#B99BFF,#2BD67B);-webkit-background-clip:text;color:transparent}.pz small{font-size:13px;font-weight:700}
.s{font-size:12px;color:#CBC5DE;margin-top:4px;white-space:nowrap}
.d{display:flex;gap:5px;margin-top:8px}.d i{width:22px;height:6px;border-radius:9px;background:rgba(255,255,255,.14);transition:.4s}.d i.on{background:#2BD67B;box-shadow:0 0 10px #2BD67B}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FFC266;margin-right:6px}.live .st{background:#2BD67B;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.3}}
.hud.up{animation:up .9s}@keyframes up{30%{transform:scale(1.08);box-shadow:0 0 0 4px #2BD67B,0 0 50px rgba(43,214,123,.7)}}
</style>
<body><div class="hud" id="h"><div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B3FF2"/><stop offset="1" stop-color="#2BD67B"/></linearGradient></defs><circle class="t" cx="50" cy="50" r="42"/><circle class="p" id="p" cx="50" cy="50" r="42"/></svg><b id="t">00:00</b></div>
<div class="i"><div class="pz"><span id="z">0</span> <small>Pz</small></div><div class="s"><span class="st"></span><span id="m">Esperando…</span></div><div class="d" id="d"></div></div></div>
<script>
let last=-1,ctx;
const tone=(f,d,at=0)=>{try{ctx=ctx||new AudioContext();const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime+at;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.025,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+d)}catch(e){}};
const $=i=>document.getElementById(i);
pjDesktop.mode(m=>document.body.classList.toggle('mv',m));
pjDesktop.status(s=>{
  const T=s.tiers,done=T.filter(t=>s.ms>=t.ms),nx=T.find(t=>s.ms<t.ms),sec=Math.floor(s.ms/1000);
  $('t').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  $('z').textContent=done.length?done[done.length-1].pz:0;
  $('p').style.strokeDashoffset=263.9*(1-Math.min(1,s.ms/(nx||T[T.length-1]).ms));
  $('m').textContent=!s.active?(s.running?'En pausa (juega para contar)':'Abre el juego'):nx?`Faltan ${Math.max(1,Math.ceil((nx.ms-s.ms)/60000))} min · +${nx.pz} Pz`:'¡Máximo conseguido!';
  $('d').innerHTML=T.map(t=>`<i class="${s.ms>=t.ms?'on':''}"></i>`).join('');
  $('h').classList.toggle('live',s.active);
  if(last>=0&&done.length>last){[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.1));$('h').classList.remove('up');void $('h').offsetWidth;$('h').classList.add('up');}
  last=done.length;
});
</script></body></html>
