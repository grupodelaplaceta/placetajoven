<!doctype html>
<html lang="es">
<head>
<meta name="theme-color" content="#0C0923">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placeta Joven</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700;800&family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* PEGI */
.pegi{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;font-size:9px;font-weight:800;letter-spacing:.04em;line-height:1;color:#fff;flex:none}
.pegi b{font-size:17px;line-height:1.1}
.pegi.sm{width:36px;height:36px;font-size:8px}.pegi.sm b{font-size:14px}
.pegi.pend{background:var(--sf2);color:var(--mt);border:1px dashed var(--bd2)}

/* Vídeo */
.vid{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;user-select:none;outline:none}
.vid #vs{position:absolute;inset:0}
.vs{position:absolute;inset:0;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;overflow:hidden;text-align:center;padding:24px}
.orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);animation:float 9s ease-in-out infinite}
.orb.a{width:46%;aspect-ratio:1;left:-8%;top:-14%}
.orb.b{width:28%;aspect-ratio:1;right:6%;bottom:-6%;animation-duration:12s}
.orb.c{width:14%;aspect-ratio:1;right:24%;top:12%;animation-duration:7s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-22px)}}
.vicon{width:clamp(72px,12vw,130px);height:clamp(72px,12vw,130px);border-radius:32%;background:rgba(255,255,255,.16);display:grid;place-items:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;position:relative}
.vicon svg{width:50%;height:50%}
@keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.vst{font-size:clamp(20px,3.6vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.1;position:relative;animation:up .8s .15s both;max-width:90%}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.vsn{position:absolute;right:16px;top:14px;font-size:12px;font-weight:700;opacity:.85}
.vcap{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;max-width:86%;background:rgba(0,0,0,.78);color:#fff;padding:8px 14px;border-radius:8px;text-align:center;font-size:clamp(13px,1.9vw,17px);line-height:1.45;transition:opacity .2s}
.vtop{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;font-size:13px;font-weight:600;transition:opacity .25s}
.vtop span:last-child{opacity:.8}
.vbig{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;background:var(--g);color:#06140D;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .2s}
.vid.paused .vbig,.vid:hover .vbig{opacity:1}
.vid.paused .vbig{opacity:1}
.vposter{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:20px}
.vposter[hidden]{display:none}
.vposter-t{font-size:clamp(20px,3vw,30px);font-weight:800}
.vctl{position:absolute;left:0;right:0;bottom:0;padding:0 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .25s}
.vid.idle .vctl,.vid.idle .vtop{opacity:0}
.vid.idle{cursor:none}
.vprog{position:relative;height:18px;display:flex;align-items:center;cursor:pointer}
.vprog::before{content:"";position:absolute;left:0;right:0;height:5px;border-radius:4px;background:rgba(255,255,255,.25)}
.vprog #vfill{position:absolute;left:0;height:5px;border-radius:4px;background:var(--g);width:0}
.vrow{display:flex;align-items:center;gap:8px;padding-top:4px}
.vrow .ibtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff;width:36px;height:36px}
.vrow .ibtn.on{background:var(--g);color:#06140D}
.vplaybtn{width:42px!important;height:42px!important}
.vtime{font-size:13px;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.chapters{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.chapters button{width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;color:var(--tx);cursor:pointer;font-size:13px;display:flex;gap:10px;align-items:center}
.chapters button:hover{border-color:var(--bd2)}
.chapters button.cur{border-color:var(--g);color:var(--g)}

/* Tests y preguntas */
.tico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;color:#fff;margin-bottom:12px}
.tcardx{display:block;text-decoration:none}
.gcard{transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--bd2);transform:translateY(-2px)}
.q h4{margin:6px 0 14px;font-size:16px;font-weight:600}
.qn{font-size:11px;color:var(--mt);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--bd);border-radius:14px;cursor:pointer;background:var(--bg);margin-bottom:8px;font-size:14px}
.opt:hover{border-color:var(--bd2)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .lt{width:30px;height:30px;border-radius:9px;border:1px solid var(--bd2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mt);flex:none}
.opt.sel{border-color:var(--p);background:rgba(123,63,242,.12)}
.opt.sel .lt{background:var(--p);color:#fff;border-color:var(--p)}
.opt.ok{border-color:var(--g);background:var(--gd)}
.opt.bad{border-color:var(--dg);background:var(--dgbg)}
.opt.dis{cursor:default}.opt.dis:hover{border-color:inherit}
.imgopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:8px}
.imgopt{position:relative;border:2px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;background:var(--bg)}
.imgopt img{width:100%;aspect-ratio:16/9;object-fit:cover}
.imgopt span{display:block;padding:7px 10px;font-size:13px;font-weight:700}
.imgopt input{position:absolute;opacity:0;pointer-events:none}
.imgopt.sel{border-color:var(--p)}.imgopt.ok{border-color:var(--g)}.imgopt.bad{border-color:var(--dg)}
.scen{background:var(--bg);border-left:3px solid var(--p);padding:12px 14px;border-radius:10px;margin:0 0 14px;color:#CFC8E6}
.optbtn{background:var(--bg);border:1px solid var(--bd2);color:var(--tx);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;margin:0 6px 6px 0}
.optbtn:hover{border-color:var(--p2)}
.optbtn.used{opacity:.4}
.optbtn.sel{background:var(--p);border-color:var(--p);color:#fff}
.optbtn.ok{background:var(--g);border-color:var(--g);color:#06140D}
.optbtn.bad{background:var(--dg);border-color:var(--dg);color:#fff}
.ordchip{display:inline-block;background:var(--gd);color:var(--g);padding:6px 10px;border-radius:8px;margin:0 6px 6px 0;font-size:13px;font-weight:600}
.mrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd2);border-radius:10px;padding:9px 10px;font:inherit;min-width:220px;max-width:100%}
.exp{font-size:13px;color:var(--mt);margin:12px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px}
.tcard2{display:flex;flex-direction:column;gap:10px}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.chip-f{flex:none;background:var(--sf);border:1px solid var(--bd);color:var(--mt);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.chip-f:hover{color:var(--tx)}
.chip-f.on{background:var(--p);color:#fff;border-color:var(--p)}
.crumbs{font-size:13px;color:var(--mt);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--tx)}


:root{--bg:#0B0913;--sf:#15111F;--sf2:#1E1832;--sf3:#2A2242;--bd:#302850;--tx:#F5F3FB;--mt:#CBC5DE;--mt2:#9F98BA;--p:#7B3FF2;--ph:#8E5BFF;--p2:#B99BFF;--g:#2BD67B;--gh:#4BE392;--gd:#0F2E20;--dg:#FF6B7C;--dgbg:#2E1520;--wn:#FFC266;--wnbg:#2E2410;--r:18px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
img,video{max-width:100%;display:block}
a{color:inherit;cursor:pointer;text-decoration:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
body.out #side,body.out #tabs{display:none}
body.out .shell{grid-template-columns:1fr}
body.out main{padding:0;max-width:none}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;background:var(--sf);border-right:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 10px 22px}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--ph));color:#fff;display:grid;place-items:center;flex:none}
.nv{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--mt);padding:12px;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;width:100%;text-align:left}
.nv:hover{background:var(--sf2);color:var(--tx)}
.nv.on{background:var(--sf3);color:#fff;box-shadow:inset 3px 0 0 var(--g)}
.nv.on svg{color:var(--g)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--sf2)}
.me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--g),#1FA65C);color:#06140D;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.av.big{width:64px;height:64px;font-size:20px}
main{padding:30px 36px 60px;max-width:1240px;width:100%;margin:0 auto;min-width:0}
.phd{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.phd h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.phd p{margin:4px 0 0;color:var(--mt)}
.bal{display:inline-flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:99px;padding:7px 16px 7px 7px;font-weight:700;font-size:14px;white-space:nowrap}
.coin{height:24px;min-width:24px;padding:0 7px;border-radius:99px;background:var(--g);color:#06140D;display:inline-grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.02em}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:22px;min-width:0}
.muted{color:var(--mt)}
.small{font-size:13px;color:var(--mt2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.blk{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ph)}
.btn:disabled{background:var(--sf3);color:#7D7599;cursor:not-allowed}
.btn.g{background:var(--g);color:#06140D}.btn.g:hover{background:var(--gh)}
.btn.ghost{background:var(--sf2);border:1px solid var(--bd);color:var(--tx)}
.btn.ghost:hover{border-color:var(--p2)}
.btn.danger{background:var(--dgbg);color:var(--dg);border:1px solid #5A2433}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--sf3);color:var(--mt);white-space:nowrap}
.pill.ok{background:var(--gd);color:var(--g)}.pill.wn{background:var(--wnbg);color:var(--wn)}.pill.dg{background:var(--dgbg);color:var(--dg)}.pill.p{background:rgba(123,63,242,.25);color:#E2D6FF}
.disc{background:var(--g);color:#06140D;padding:2px 7px;font-weight:800;border-radius:6px;font-size:13px}
.studio{color:var(--g);font-weight:700}
.bar{height:8px;background:var(--sf3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .4s}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec h2{margin:0;font-size:19px;font-weight:700}
.sec a{font-size:14px;color:var(--g);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:4px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--gd);border:1px solid #1F5A3C;border-radius:var(--r);padding:16px 20px;margin-bottom:22px}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-left:4px solid var(--p2)}
.next b{display:block;font-size:18px;margin:2px 0}
.tgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tile{display:grid;gap:8px;padding:18px;border-radius:var(--r);background:var(--sf);border:1px solid var(--bd);transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--bd)}
.tile b{font-size:16px;line-height:1.25}
.tile small{color:var(--mt2)}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.ico.sm{width:36px;height:36px;border-radius:10px}
.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,300px);gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.row-scroll>*{scroll-snap-align:start}
.cgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cov{position:relative;aspect-ratio:460/215;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:var(--sf2)}
.cov img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,9,19,.9),transparent 55%)}
.cov .t{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;font-weight:700;font-size:15px;line-height:1.2}
.cov .ini{width:100%;height:100%;display:grid;place-items:center;font-size:34px;font-weight:800}
.cov .tg{position:absolute;top:10px;left:10px;z-index:1;display:flex;gap:6px}
.tag{background:rgba(11,9,19,.85);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.tag.dg{background:var(--dg);color:#1a0508}.tag.p{background:var(--p)}
.gc{display:block;transition:transform .15s}
.gc:hover{transform:translateY(-3px)}
.gc:hover .cov{border-color:var(--g)}
.gc .pr{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;gap:8px}
.gc .pr b{font-size:15px}
.gc .meta{font-size:13px;color:var(--mt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--bd);min-height:380px;display:flex;align-items:flex-end;background:var(--sf)}
.hbg{position:absolute;inset:0;background-size:cover!important;background-position:center!important}
.hsh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,9,19,.96),rgba(11,9,19,.55) 55%,rgba(11,9,19,.1)),linear-gradient(0deg,rgba(11,9,19,.9),transparent 50%)}
.hbody{position:relative;padding:36px 40px 62px;max-width:600px;display:grid;gap:12px}
.hbody h2{margin:0;font-size:clamp(28px,3.6vw,42px);font-weight:800;line-height:1.08;letter-spacing:-.02em}
.hbody p{margin:0;color:#E4DFF2;max-width:520px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(11,9,19,.7);color:#fff;cursor:pointer;z-index:3;display:grid;place-items:center;padding:0}
.arr:hover{background:var(--p)}
.arr.l{left:14px}.arr.r{right:14px}
.dots{position:absolute;left:40px;bottom:22px;display:flex;gap:7px;z-index:3}
.dots button{width:9px;height:9px;border-radius:99px;border:0;background:rgba(255,255,255,.35);padding:0;cursor:pointer}
.dots button.on{background:var(--g);width:28px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;background:var(--sf);border:1px solid var(--bd);color:var(--mt);padding:8px 15px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip.st{border-style:dashed}.chip.st.on{border-style:solid}.chip-sep{flex:none;width:1px;align-self:stretch;background:var(--bd);margin:2px 6px}
.toolbar input{width:260px;max-width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;outline:none}
input[type=text],input[type=number],input[type=search],input[type=password],textarea,select{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;outline:none;background:var(--bg);color:var(--tx)}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
textarea{resize:vertical}
select{width:auto;min-width:150px}
.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--mt)}
.empty{text-align:center;padding:50px 22px;color:var(--mt)}
.seg-g{display:flex;gap:6px}
.seg{background:var(--sf);border:1px solid var(--bd);color:var(--mt);padding:7px 14px;border-radius:10px;font-weight:700;cursor:pointer}
.seg.on{background:var(--p);border-color:var(--p);color:#fff}
.seg:disabled{opacity:.4;cursor:not-allowed}
.more{text-align:center;margin-top:20px}
.tc{display:flex;flex-direction:column;gap:10px}
.tc h3{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.tc-top{display:flex;justify-content:space-between;align-items:center}
.transcript{margin-top:18px;border-left:4px solid var(--p2)}
.transcript h3{margin:0 0 6px;font-size:18px}
.transcript p{margin:0;font-size:16px;line-height:1.7;color:#E8E3F5}
.tr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.kfig{display:inline-grid;gap:2px;padding:12px 18px;border-radius:14px;background:rgba(0,0,0,.3);width:max-content;border:1px solid rgba(255,255,255,.14)}
.kfig b{font-size:clamp(22px,3vw,32px);font-weight:800}
.kfig span{font-size:13px}
.qbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-weight:700}
.qbar .bar{flex:1}
.qdots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.qd{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--sf2);color:var(--mt);font-weight:700;cursor:pointer;padding:0}
.qd.cur{background:var(--p);border-color:var(--p);color:#fff}
.qd.done{border-color:var(--g);color:var(--g)}

/* =====================================================================
   Rediseño sobrio: paleta del logo (azul marino + verde), sin brillos,
   sin degradados, sin cristal, esquinas contenidas e iconos de línea.
   ===================================================================== */
:root{--bg:#0C0923;--sf:#141035;--sf2:#1B1743;--sf3:#25205A;--bd:#2A2563;--bd2:#3D367F;--tx:#F4F2FB;--mt:#C9C4E3;--mt2:#9790BE;
 --p:#5547E8;--ph:#6A5DF0;--p2:#B9B2FF;--g:#00C164;--gh:#1BD67F;--gd:rgba(0,196,106,.13);--navy:#1C005F}
html,body{background:var(--bg)!important}
body{background-image:none!important}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.orb,.hsh2,.tt-wm{display:none!important}
/* Superficies planas */
.card,.gc,.tt,.lvl,.plan,.mod,.opp,.opp2,.funds,.edu-b,.np2,.lp-t,.lp-g,.lp-steps li,.mods-l li,.lock2,.tg2{background:var(--sf)!important;border:1px solid var(--bd)!important;border-radius:12px!important;box-shadow:none!important}
.card:hover,.gc:hover,.tt:hover,.lvl:hover,.plan:hover{box-shadow:none!important;transform:none!important;border-color:var(--bd2)!important}
.gc img,.tc img{transition:none!important}.gc:hover img,.tc:hover img{transform:none!important}
.gc,.tt,.crs{cursor:pointer}
.gc:hover,.tt:hover{border-color:var(--g)!important}
.plan.hl{border-color:var(--g)!important}
/* Barras: opacas */
#side,.tabs,.lp-top{background:var(--bg)!important;border-color:var(--bd)!important}
.sc #side{box-shadow:none!important}
/* Navegación: texto con subrayado, no pastillas */
#side .nv{border-radius:8px!important;background:transparent!important;color:var(--mt);padding:8px 12px!important;font-weight:500;box-shadow:none!important}
#side .nv:hover{background:var(--sf2)!important;color:var(--tx)}
#side .nv.on{color:var(--tx)!important;background:transparent!important;box-shadow:inset 0 -2px 0 var(--g)!important;border-radius:0!important}
.nv svg,.nv i{color:var(--mt2)}.nv.on svg,.nv.on i{color:var(--g)}
#side .a11yb,.lp-top .a11yb{border-radius:10px!important;width:38px;height:38px}
#side .pzchip{border-radius:10px!important;background:var(--sf)!important;box-shadow:none!important;padding:6px 12px}
#side .me{border-radius:10px!important;background:transparent!important}.av{border-radius:8px!important}
.tabs .tab{border-radius:0!important;box-shadow:none!important}.tab.on{color:var(--tx)!important}.tab.on svg,.tab.on i{color:var(--g)}
.tabs .tab.on::after{background:var(--g)!important;top:-9px!important;border-radius:0 0 2px 2px!important}
/* Botones */
.btn{border-radius:10px!important;background:var(--g)!important;background-image:none!important;color:#05150C!important;border:0!important;font-weight:700;box-shadow:none!important;letter-spacing:0}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:none!important;box-shadow:none!important}
.btn.ghost{background:transparent!important;color:var(--tx)!important;border:1px solid var(--bd2)!important}
.btn.ghost:hover:not(:disabled){background:var(--sf2)!important;filter:none}
.btn:disabled{opacity:.45}
.btn.danger,.btn.dg{background:transparent!important;color:#FF8C95!important;border:1px solid #6B2B3A!important}
/* Chips, etiquetas y avisos: rectángulos pequeños */
.pill,.tag,.crs-rw,.pl-t,.soon,.mod-b,.chip-f,.seg2 button,.rib{border-radius:6px!important}
.chip-f{background:var(--sf)!important;border:1px solid var(--bd)!important;color:var(--mt)}.chip-f.on{background:var(--g)!important;border-color:var(--g)!important;color:#05150C!important}
.seg{border-radius:10px!important;background:var(--sf)!important}.seg button{border-radius:7px!important}.seg button.on{background:var(--sf3)!important;color:var(--tx)!important}
.seg2 button.on{background:var(--g)!important;border-color:var(--g)!important;color:#05150C!important}
.swt{border-radius:10px!important}.swt .sw{background:var(--sf3)}
input,textarea,select{border-radius:10px!important;box-shadow:none!important}
input:focus,textarea:focus,select:focus{border-color:var(--g)!important;box-shadow:none!important}
:focus-visible{outline:2px solid var(--g)!important;outline-offset:2px;border-radius:6px}
/* Iconos: línea fina y sin cuadros de color */
.lucide{stroke-width:1.5}
.tt-ic,.crs-ic,.mi,.np-ic,.lvn,.pki,.src-ic{background:transparent!important;color:var(--g)!important;border:0!important;border-radius:0!important;box-shadow:none!important;width:auto!important;height:auto!important;padding:0}
.crs-ic.big{width:auto!important;height:auto!important}
.lvl.lock .lvn{color:var(--mt2)!important}
.tt-go{background:transparent!important;color:var(--mt2)!important;width:auto;height:auto}.tt:hover .tt-go{color:var(--g)!important;transform:none!important}
.tt::before{width:2px!important;opacity:.9}
.lvl.full .lvn{color:var(--g)!important}
.mods-l .mn{border-radius:8px!important;background:var(--sf2)!important}.mods-l li.ok .mn{background:var(--g)!important}
.lt{border-radius:8px!important}.lt.nx{background:var(--p)!important;animation:none!important}
.mod.key .mi,.mod.play .mi{background:transparent!important}
/* Inicio */
.hm-next{background:var(--sf)!important;color:var(--tx)!important;border:1px solid var(--bd);border-left:3px solid var(--g);border-radius:12px!important}
.hm-next:hover{transform:none!important;border-color:var(--g)}
.hm-next small{color:var(--g);opacity:1}.hm-next b{font-weight:700}.hm-next span{color:var(--mt)}
.hm-next em{background:var(--g)!important;color:#05150C!important;border-radius:10px!important}
.hm-t span{color:var(--g)}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--mt2)}
/* Tipografía y ritmo */
h1,.hm-t{font-weight:700;letter-spacing:-.025em}
main h1{font-size:clamp(26px,3vw,34px)}
.sec{margin:26px 0 12px!important}.sec h2{font-size:17px;font-weight:700}
.sec a,.lk{color:var(--g)!important}
.lead{color:var(--mt)}
/* Portada y páginas públicas */
.lp-hero h1 u{background:none;text-decoration:underline;text-decoration-color:var(--g);text-decoration-thickness:3px;text-underline-offset:8px}
.lp-art,.lp-g .cov{border-radius:12px!important;box-shadow:none!important}
.np{background:var(--sf)!important;border-block:1px solid var(--bd)}.np-line svg,.np-line i{color:var(--g)}
.lp-t{border-left:2px solid var(--tc)!important}.lp-t span{background:transparent!important;color:var(--tc)!important;width:auto!important;height:auto!important}
.lp-steps span{color:var(--g)}
/* Media */
.frame,.vid,.vw,.yt{border-radius:12px!important;box-shadow:none!important;border:1px solid var(--bd)}
.vctl{border-radius:10px!important;background:rgba(12,9,35,.92)!important;box-shadow:none}
.vbig{box-shadow:none!important;background:var(--g)!important;color:#05150C}
.vctl .vplaybtn{background:var(--g)!important}
.vs.v2 .vicon{border-radius:12px!important;background:rgba(255,255,255,.14)!important;box-shadow:none}
.kc,.cm,.qo,.v2e{border-radius:10px!important}.kck{border-radius:8px!important}
/* Ventanas y avisos */
.src,.a11y{border-radius:14px!important;box-shadow:0 18px 50px rgba(0,0,0,.55)!important}
.toast{border-radius:10px!important;box-shadow:0 10px 30px rgba(0,0,0,.5)!important;border:1px solid var(--bd2)!important}
.a11y-ov,.src-ov{background:rgba(6,4,18,.78)!important}
.ckb{border-radius:12px!important;box-shadow:0 10px 30px rgba(0,0,0,.5)!important}
/* Movimiento contenido */
#main:not(.static)>*{animation:fadeIn .18s both!important}
.pzchip.bump,.kp,.lt.nx{animation:none}
.opt.ok,.opt.bad,.pki{animation:none!important}
/* Móvil */
@media(max-width:760px){
 .card,.gc,.tt,.lvl,.plan,.mod,.opp,.funds{border-radius:10px!important}

 .tabs{padding-top:6px!important}

/* Generación de tests: generadores procedurales + banco de preguntas + variaciones */
const hs=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick=(a,r)=>a[Math.floor(r()*a.length)];
function shuffle(a,r){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function gLinear(r){const x=1+Math.floor(r()*12),a=2+Math.floor(r()*8),b=Math.floor(r()*41)-20,c=a*x+b;
 return {k:'number',t:`Resuelve: ${a}x ${b<0?'−':'+'} ${Math.abs(b)} = ${c}. ¿Cuánto vale x?`,c:x,tol:0,e:`Restas ${b} a ambos lados y divides entre ${a}: x = ${x}.`};}
function gPercent(r){const p=pick([5,10,15,20,25,30,40,50,75],r),n=20*(1+Math.floor(r()*20));
 return {k:'number',t:`¿Cuánto es el ${p} % de ${n}?`,c:n*p/100,tol:0,e:`${p} % de ${n} = ${n} × ${p} / 100 = ${n*p/100}.`};}
function gGeo(r){const a=2+Math.floor(r()*4),q=2+Math.floor(r()*2),s=[0,1,2,3].map(i=>a*q**i);
 return {k:'number',t:`¿Qué número sigue? ${s.join(', ')}, …`,c:a*q**4,tol:0,e:`Cada término se multiplica por ${q}.`};}
function gArith(r){const a=1+Math.floor(r()*10),d=3+Math.floor(r()*7),s=[0,1,2,3].map(i=>a+i*d);
 return {k:'number',t:`¿Qué número sigue? ${s.join(', ')}, …`,c:a+4*d,tol:0,e:`Cada término suma ${d}.`};}
function gPrime(r){const pr=pick([11,13,17,19,23,29,31,37],r);const comps=shuffle([4,6,8,9,10,12,14,15,16,18,20,21,22,24,25,26,27,28,30,32,33,34,35,36,38,39,40],r).slice(0,3);
 const o=shuffle([pr,...comps],r);return {k:'single',t:'¿Cuál de estos números es primo?',o:o.map(String),c:o.indexOf(pr),e:`${pr} solo se divide entre 1 y sí mismo.`};}
function gCalc(r){const a=2+Math.floor(r()*20),b=2+Math.floor(r()*9),c=2+Math.floor(r()*9),d=1+Math.floor(r()*15);
 return {k:'number',t:`Calcula: ${a} + ${b} × ${c} − ${d}`,c:a+b*c-d,tol:0,e:'Primero multiplicas y después sumas y restas.'};}
function gSave(r){const m=(5+Math.floor(r()*30))*10,k=2+Math.floor(r()*11);
 return {k:'number',t:`Ahorras ${m} € al mes durante ${k} meses. ¿Cuánto llevas ahorrado en euros?`,c:m*k,tol:0,e:`${m} × ${k} = ${m*k} €.`};}
function gDisc(r){const P=(4+Math.floor(r()*36))*10,d=pick([10,20,25,50],r),f=+(P*(100-d)/100).toFixed(2);
 return {k:'number',t:`Un producto cuesta ${P} € y tiene un ${d} % de descuento. ¿Cuánto cuesta ahora?`,c:f,tol:0.01,e:`${P} × ${100-d} % = ${f} €.`};}
function gInterest(r){const C=(1+Math.floor(r()*10))*100,rt=pick([2,3,4,5],r),y=1+Math.floor(r()*5),I=+(C*rt*y/100).toFixed(2);
 return {k:'number',t:`Depositas ${C} € al ${rt} % de interés simple anual durante ${y} años. ¿Cuánto interés generas en euros?`,c:I,tol:0.01,e:`${C} × ${rt} % × ${y} = ${I} €.`};}
function gRule(r){const I=(10+Math.floor(r()*40))*100,c=+(I*0.2).toFixed(2);
 return {k:'number',t:`Cobras ${I} € al mes. Con la regla 50 30 20, ¿cuánto destinas al ahorro?`,c,tol:0.01,e:`El 20 % de ${I} € son ${c} €.`};}

/* Variante: baraja opciones y ajusta la respuesta correcta */
function variant(q,r){
 if(['single','blank','decision','tf'].includes(q.k)&&q.o&&q.k!=='tf'){
  const perm=shuffle(q.o.map((_,i)=>i),r);
  return {...q,o:perm.map(i=>q.o[i]),c:perm.indexOf(q.c)};
 }
 if(q.k==='multi'){
  const perm=shuffle(q.o.map((_,i)=>i),r);
  return {...q,o:perm.map(i=>q.o[i]),c:q.c.map(x=>perm.indexOf(x)).sort((a,b)=>a-b)};
 }
 if(q.k==='img'){
  const perm=shuffle(q.imgs.map((_,i)=>i),r);
  return {...q,imgs:perm.map(i=>q.imgs[i]),c:perm.indexOf(q.c)};
 }
 return q;
}
const SUBLVL=['I','II','III'];
function buildTests(){
 const out=[];
 TOPICS.forEach(T=>{
  const gens=GENS[T.id]||[], auth=AUTH[T.id]||[];
  for(let s=0;s<50;s++){
   const r=rng(hs(T.id+'#'+s)), lvl=(s%3)+1;
   const want=4, nGen=gens.length?Math.min(lvl+1,3):0;
   const items=[];
   for(let g=0;g<nGen;g++) items.push(pick(gens,r)(r));
   const pool=shuffle(auth,r);
   for(const q of pool){ if(items.length>=want) break; items.push(q); }
   const qs=items.slice(0,want).map(q=>variant(q,r));
   const sub=T.subs[s%T.subs.length];
   out.push({id:`${T.id}-${s}`,tid:T.id,lvl,title:`${sub} · Nivel ${SUBLVL[lvl-1]} · #${s+1}`,num:s+1,min:10+5*(lvl-1),pass:3,dur:`${6+lvl*2} min`,nivel:['Básico','Intermedio','Avanzado'][lvl-1],c:T.color,q:qs});
  }
 });
 return out;
}

/* Respuestas */
function answer(aid,qi,val){(draft[aid]=draft[aid]||[])[qi]=val;render();}
function tog(aid,qi,k){const cur=(draft[aid]&&draft[aid][qi])||[];answer(aid,qi,cur.includes(k)?cur.filter(x=>x!==k):[...cur,k]);}
function ordpush(aid,qi,k){const cur=(draft[aid]&&draft[aid][qi])||[];if(!cur.includes(k)) answer(aid,qi,[...cur,k]);}
function matchSet(aid,qi,li,val){const arr=[...((draft[aid]&&draft[aid][qi])||[])];arr[li]=val===''?undefined:+val;answer(aid,qi,arr);}
function classifySet(aid,qi,ii,ci){const arr=[...((draft[aid]&&draft[aid][qi])||[])];arr[ii]=ci;answer(aid,qi,arr);}
function retry(aid){delete results[aid];delete draft[aid];render();}
const KN={single:'Opción única',tf:'Verdadero o falso',multi:'Respuesta múltiple',order:'Ordenar',match:'Relacionar',blank:'Completar',img:'Imagen',classify:'Clasificar',number:'Respuesta numérica',decision:'Decisión'};
function isFilled(q,v){
  switch(q.k){
    case 'multi': return Array.isArray(v)&&v.length>0;
    case 'order': return Array.isArray(v)&&v.length===q.c.length;
    case 'match': case 'classify': return Array.isArray(v)&&q.c.every((_,i)=>v[i]!==undefined);
    case 'number': return v!==undefined&&String(v).trim()!=='';
    default: return v!==undefined;
  }
}
function isCorrect(q,v){
  switch(q.k){
    case 'multi': return Array.isArray(v)&&v.length===q.c.length&&q.c.every(x=>v.includes(x));
    case 'order': case 'match': case 'classify': return isFilled(q,v)&&q.c.every((x,i)=>v[i]===x);
    case 'number': {const n=Number(String(v).replace(',','.'));return !isNaN(n)&&Math.abs(n-q.c)<=(q.tol||0);}
    default: return v===q.c;
  }
}
function submit(aid){
  const a=testById(aid), d=draft[aid]||[];
  if(!a.q.every((q,i)=>isFilled(q,d[i]))) return toast('Responde todas las preguntas antes de enviar.','wn');
  const ok=a.q.filter((q,i)=>isCorrect(q,d[i])).length, passed=ok>=a.pass;
  let reward;
  if(!passed){
    reward={t:'Sin recompensa en este intento. Revisa las explicaciones y vuelve a intentarlo cuando quieras.',cls:'wn'};
  } else if(isDone(aid)){
    reward={t:'Ya cobraste las Pz de este test. Repetirlo sirve para practicar, no para volver a cobrar.',cls:'ok'};
  } else {
    state.claims[aid]={status:'pending'}; save();
    const r=bank('credit','act:'+state.profile.id+':'+aid,a.min,'Test: '+topicOf(a.tid).title+' · '+a.title);
    state.claims[aid]={status:'confirmed',ref:r.ref,amount:a.min};
    reward={t:`+${a.min} Pz abonadas. Referencia Banco: ${r.ref}`,cls:'ok'};
    toast(`+${a.min} Pz abonadas`,'ok');
  }
  results[aid]={ok,total:a.q.length,passed,reward};
  save(); render();
}
function optRow(aid,qi,k,v,c,R,label){
  const sel=v===k; let cls=sel?' sel':'';
  if(R){ if(k===c) cls=' ok'; else if(sel) cls=' bad'; }
  return `<label class="opt${cls}${R?' dis':''}"><input type="radio" name="r${aid}${qi}" ${sel?'checked':''} ${R?'disabled':''} onchange="answer('${aid}',${qi},${k})"><span class="lt">${'ABC'[k]||k+1}</span>${esc(label)}</label>`;
}
function multiRow(aid,qi,k,v,c,R,label){
  const sel=(v||[]).includes(k); let cls=sel?' sel':'';
  if(R){ if(c.includes(k)) cls=' ok'; else if(sel) cls=' bad'; }
  return `<label class="opt${cls}${R?' dis':''}"><input type="checkbox" ${sel?'checked':''} ${R?'disabled':''} onchange="tog('${aid}',${qi},${k})"><span class="lt">${'ABC'[k]||k+1}</span>${esc(label)}</label>`;
}
function imgCard(aid,qi,k,v,c,R,src){
  const sel=v===k; let cls=sel?' sel':'';
  if(R){ if(k===c) cls=' ok'; else if(sel) cls=' bad'; }
  return `<label class="imgopt${cls}"><input type="radio" name="i${aid}${qi}" ${sel?'checked':''} ${R?'disabled':''} onchange="answer('${aid}',${qi},${k})"><img src="${src}" alt="Opción ${'ABC'[k]}" loading="lazy"><span>Opción ${'ABC'[k]}</span></label>`;
}
function qBody(aid,qi,q,d,R){
  const v=d[qi];
  switch(q.k){
    case 'tf': return ['Verdadero','Falso'].map((o,k)=>optRow(aid,qi,k,v,q.c,R,o)).join('');
    case 'single': case 'blank': case 'decision':
      return (q.sc?`<p class="scen">${esc(q.sc)}</p>`:'')+q.o.map((o,k)=>optRow(aid,qi,k,v,q.c,R,o)).join('');
    case 'img': return `<div class="imgopts">${q.imgs.map((s,k)=>imgCard(aid,qi,k,v,q.c,R,s)).join('')}</div>`;
    case 'multi': return q.o.map((o,k)=>multiRow(aid,qi,k,v,q.c,R,o)).join('');
    case 'order': {
      const picked=v||[];
      return `<div>${picked.map((k,n)=>`<span class="ordchip">${n+1}. ${esc(q.items[k])}</span>`).join('')||'<span class="small">Pulsa los elementos en el orden correcto.</span>'}</div>
        <div style="margin-top:10px">${q.items.map((it,k)=>{const used=picked.includes(k);return `<button class="optbtn${used?' used':''}" ${R||used?'disabled':''} onclick="ordpush('${aid}',${qi},${k})">${esc(it)}</button>`}).join('')}</div>
        ${!R&&picked.length?`<button class="btn ghost sm" style="margin-top:8px" onclick="answer('${aid}',${qi},[])">Reiniciar orden</button>`:''}
        ${R?`<p class="exp">Orden correcto: ${q.c.map((k,n)=>`${n+1}. ${esc(q.items[k])}`).join(' · ')}</p>`:''}`;
    }
    case 'match': return q.left.map((l,li)=>`<div class="mrow"><span>${esc(l)}</span>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select aria-label="Pareja para ${esc(l)}" ${R?'disabled':''} onchange="matchSet('${aid}',${qi},${li},this.value)">
          <option value="">Elige…</option>${q.right.map((rr,ri)=>`<option value="${ri}" ${v&&v[li]===ri?'selected':''}>${esc(rr)}</option>`).join('')}</select>
        ${R?(v&&v[li]===q.c[li]?pill('Correcto','ok'):pill('Correcto: '+esc(q.right[q.c[li]]),'dg')):''}</div></div>`).join('');
    case 'classify': return q.items.map((it,ii)=>`<div class="mrow"><span>${esc(it)}</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${q.cats.map((ct,ci)=>{
          const sel=v&&v[ii]===ci; let cls=sel?' sel':'';
          if(R){ if(q.c[ii]===ci) cls=' ok'; else if(sel) cls=' bad'; }
          return `<button class="optbtn${cls}" ${R?'disabled':''} onclick="classifySet('${aid}',${qi},${ii},${ci})">${esc(ct)}</button>`;
        }).join('')}</div></div>`).join('');
    case 'number': return `<input type="text" inputmode="decimal" placeholder="Escribe tu respuesta" value="${v!==undefined?esc(v):''}" ${R?'disabled':''} onchange="answer('${aid}',${qi},this.value)" style="max-width:260px">
        ${R?`<p class="exp">Respuesta correcta: ${q.c}</p>`:''}`;
    default: return '';
  }
}
function qHtml(aid,qi,q,d,R){
  const ok=R?isCorrect(q,d[qi]):null;
  return `<div class="card q" style="margin-bottom:14px">
    <div class="row"><div class="qn">Pregunta ${qi+1} · ${KN[q.k]}</div>${R?(ok?pill('Correcta','ok'):pill('Incorrecta','dg')):''}</div>
    <h4>${esc(q.t)}</h4>${qBody(aid,qi,q,d,R)}${R?`<div class="exp">${esc(q.e)}</div>`:''}</div>`;
}

/* Lección en vídeo: línea de tiempo continua */
const VID={tid:null,t:0,playing:false,cur:-1,raf:null,last:null,cc:true,snd:true,speed:1,started:false,idle:null};
const VD=s=>Math.max(7000,s.x.length*85);
const vTotal=L=>L.scenes.reduce((a,s)=>a+VD(s),0);
const vStart=(L,idx)=>{let a=0;for(let i=0;i<idx;i++) a+=VD(L.scenes[i]);return a;};
const vIndexAt=(L,t)=>{let a=0;for(let i=0;i<L.scenes.length;i++){a+=VD(L.scenes[i]);if(t<a) return i;}return L.scenes.length-1;};
const mmss=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function vInit(tid){ if(VID.tid!==tid){ vStop(); Object.assign(VID,{tid,t:0,cur:-1,started:false,last:null}); } }
function vSpeak(t){
  if(!VID.snd||!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='es-ES'; u.rate=Math.min(1.6,Math.max(.6,.95*VID.speed));
    const v=speechSynthesis.getVoices().find(x=>/^es/i.test(x.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function vStop(){
  VID.playing=false; if(VID.raf) cancelAnimationFrame(VID.raf); VID.raf=null; VID.last=null;
  if('speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}}
}
function vPlay(){
  const L=LESSONS[VID.tid]; if(!L) return;
  if(VID.playing){ vStop(); vPaint(); return; }
  if(VID.t>=vTotal(L)) VID.t=0;
  VID.playing=true; VID.started=true; VID.last=null;
  VID.raf=requestAnimationFrame(vTick); vPaint(); vWake();
}
function vTick(ts){
  if(!VID.playing) return;
  const L=LESSONS[VID.tid];
  if(VID.last==null) VID.last=ts;
  VID.t+=(ts-VID.last)*VID.speed; VID.last=ts;
  const tot=vTotal(L);
  if(VID.t>=tot){ VID.t=tot; vStop(); vPaint(); toast('Lección terminada. Ya puedes hacer los tests del tema.','ok'); return; }
  const idx=vIndexAt(L,VID.t);
  if(idx!==VID.cur){ VID.cur=idx; vScene(); vSpeak(L.scenes[idx].x); }
  vPaint();
  VID.raf=requestAnimationFrame(vTick);
}
function vSetT(t){
  const L=LESSONS[VID.tid], tot=vTotal(L);
  VID.t=Math.max(0,Math.min(tot,t)); VID.last=null; VID.started=true;
  const idx=vIndexAt(L,VID.t);
  if(idx!==VID.cur){ VID.cur=idx; vScene(); if(VID.playing) vSpeak(L.scenes[idx].x); }
  vPaint();
}
function vSeek(ev){const r=ev.currentTarget.getBoundingClientRect();const f=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));vSetT(f*vTotal(LESSONS[VID.tid]));}
function vGo(i){vSetT(vStart(LESSONS[VID.tid],i)+1);}
function vStep(d){const L=LESSONS[VID.tid];const cur=VID.cur<0?vIndexAt(L,VID.t):VID.cur;vGo(Math.min(L.scenes.length-1,Math.max(0,cur+d)));}
function vKey(e){
  if(e.code==='Space'){e.preventDefault();vPlay();}
  else if(e.key==='ArrowRight'){e.preventDefault();vSetT(VID.t+5000);}
  else if(e.key==='ArrowLeft'){e.preventDefault();vSetT(VID.t-5000);}
  else if(e.key.toLowerCase()==='f'){vFs();}
}
function vWake(){
  const v=$('#vid'); if(!v) return;
  v.classList.remove('idle'); clearTimeout(VID.idle);
  if(VID.playing) VID.idle=setTimeout(()=>{const x=$('#vid'); if(x&&VID.playing) x.classList.add('idle');},2400);
}
function vCC(){VID.cc=!VID.cc;const b=$('#vcc');if(b) b.classList.toggle('on',VID.cc);const c=$('#vcap');if(c) c.hidden=!VID.cc;}
function vSnd(){VID.snd=!VID.snd;if(!VID.snd&&'speechSynthesis' in window) speechSynthesis.cancel();const b=$('#vsnd');if(b) b.classList.toggle('on',VID.snd);}
function vSpeed(){const a=[0.75,1,1.25,1.5];VID.speed=a[(a.indexOf(VID.speed)+1)%a.length];const b=$('#vspd');if(b) b.textContent=VID.speed+'x';}
function vFs(){const v=$('#vid');if(!v) return;if(document.fullscreenElement) document.exitFullscreen();else if(v.requestFullscreen) v.requestFullscreen();}
function vScene(){
  const L=LESSONS[VID.tid], idx=Math.max(0,VID.cur), s=L.scenes[idx];
  const sc=$('#vs'); if(sc) sc.innerHTML=sceneHtml(L,idx);
  const cap=$('#vcap'); if(cap){cap.textContent=s.x; cap.hidden=!VID.cc;}
  document.querySelectorAll('.chapters button').forEach((b,k)=>b.classList.toggle('cur',k===idx));
}
function vPaint(){
  const L=LESSONS[VID.tid]; if(!L) return;
  const tot=vTotal(L), f=$('#vfill'), tm=$('#vtime'), pb=$('#vplay'), poster=$('#vposter'), big=$('#vbig'), vid=$('#vid');
  if(f) f.style.width=(VID.t/tot*100)+'%';
  if(tm) tm.textContent=`${mmss(VID.t)} / ${mmss(tot)}`;
  if(pb) pb.innerHTML=ico(VID.playing?'pause':'play',18);
  if(big) big.innerHTML=ico(VID.playing?'pause':'play',32);
  if(poster) poster.hidden=VID.started;
  if(vid) vid.classList.toggle('paused',!VID.playing);
}
function sceneHtml(L,idx){
  const s=L.scenes[idx];
  return `<div class="vs" style="--c:${L.color}"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i>
    <div class="vicon">${ico(s.i,64)}</div><div class="vst">${esc(s.t)}</div><div class="vsn">${idx+1} / ${L.scenes.length}</div></div>`;
}
function playerHtml(tid){
  const L=LESSONS[tid], idx=VID.cur>=0?VID.cur:0, s=L.scenes[idx], tot=vTotal(L);
  return `<div class="vid${VID.playing?'':' paused'}" id="vid" tabindex="0" onmousemove="vWake()" onkeydown="vKey(event)" aria-label="Lección en vídeo: ${esc(L.title)}">
    <div id="vs" style="position:absolute;inset:0">${sceneHtml(L,idx)}</div>
    <div class="vcap" id="vcap" ${VID.cc?'':'hidden'}>${esc(s.x)}</div>
    <div class="vtop"><span>${esc(L.title)}</span><span>Placeta Joven · Lecciones</span></div>
    <button class="vbig" id="vbig" onclick="vPlay()" aria-label="Reproducir o pausar">${ico(VID.playing?'pause':'play',32)}</button>
    <div class="vposter" id="vposter" ${VID.started?'hidden':''}>
      <div class="vposter-t">${esc(L.title)}</div>
      <button class="btn g" onclick="vPlay()">${ico('play',18)} Reproducir lección</button>
      <div class="small" style="color:#ddd">Duración aproximada ${mmss(tot)}</div></div>
    <div class="vctl">
      <div class="vprog" onclick="vSeek(event)" role="slider" aria-label="Progreso"><i id="vfill" style="width:${VID.t/tot*100}%"></i></div>
      <div class="vrow">
        <button class="ibtn" onclick="vStep(-1)" aria-label="Anterior">${ico('prev',18)}</button>
        <button class="ibtn vplaybtn" id="vplay" onclick="vPlay()" aria-label="Reproducir">${ico(VID.playing?'pause':'play',18)}</button>
        <button class="ibtn" onclick="vStep(1)" aria-label="Siguiente">${ico('next',18)}</button>
        <span class="vtime" id="vtime">${mmss(VID.t)} / ${mmss(tot)}</span>
        <span style="flex:1"></span>
        <button class="ibtn${VID.cc?' on':''}" id="vcc" onclick="vCC()" aria-label="Subtítulos">${ico('cc',18)}</button>
        <button class="ibtn${VID.snd?' on':''}" id="vsnd" onclick="vSnd()" aria-label="Locución">${ico('sound',18)}</button>
        <button class="ibtn" id="vspd" onclick="vSpeed()" aria-label="Velocidad">${VID.speed}x</button>
        <button class="ibtn" onclick="vFs()" aria-label="Pantalla completa">${ico('full',18)}</button>
      </div>
    </div></div>`;
}

function testView(id){

  const r=results[id], d=draft[id]||[], n=a.q.length, cur=Math.min(STEP[id]||0,n-1), last=cur===n-1;
  const answered=a.q.filter((q,i)=>isFilled(q,d[i])).length, T=topicOf(a.tid);

function buy(pid){
  const p=prod(pid), fail=m=>toast(m,'dg');
  if(!p) return fail('Juego no disponible.');
  if(!hasPlan('key')) return fail('Activa un plan de la plataforma para canjear claves.');
  if(p.adult&&!ageOk) return fail('Confirma que tienes 18 años o más.');
  if(!accepted) return fail('Acepta las condiciones de canje.');
  if(state.orders.some(o=>o.pid===pid)) return fail('Ya tienes este juego.');
  if(p.stock<1) return fail('Agotado.');
  const oid='ORD-'+String(state.orders.length+1).padStart(4,'0'), isCard=false;
  let price,ref;
  if(isCard){price=eurOf(p);ref='CARD-'+Math.random().toString(36).slice(2,8).toUpperCase();}
  else{
    price=fp(p);
    const r=bank('debit','ord:'+oid,price,'Canje: '+p.title);
    if(r.error) return fail(r.error);
    ref=r.ref;
  }
  p.stock--;
  if(!isCard){state.taxPz=+((state.taxPz||0)+taxOf(p).t).toFixed(2);}
  state.orders.unshift({id:oid,pid,title:p.title,dev:p.dev,price,tax:isCard?0:taxOf(p).t,cur:isCard?'€':'Pz',ref,key:genKey(),status:'Entregado',at:Date.now()});

  state.reviews=(state.reviews||[]).concat({pid:ARC.pid,name:state.profile.name,stars:ARC.stars,text:t,at:Date.now()});

}
function arcBest(){return TIERS.filter(t=>ARC.ms>=t.ms&&(!t.rated||ARC.rated)).pop()||null;}
function arcAmt(){const b=arcBest();return b?b.pz+(ARC.rated?BONUS_PZ:0):0;}
function arcClaim(){
  const key=`arc:${state.profile.id}:${ARC.pid}`, best=arcBest();
  if(state.bankOps[key]) return toast('Ya cobraste esta prueba.','wn');
  if(!best) return toast('Aún no has alcanzado un nivel.','wn');
  if(ARC.flag||ARC.locked) return toast('Sesión en revisión.','dg');
  const r=bank('credit',key,arcAmt(),`Arcade Shield · ${prod(ARC.pid).title} · ${best.l}`);
  if(r.error) return toast(r.error,'dg');
  save(); toast(`+${arcAmt()} Pz abonadas`,'ok'); updArc();
}
function updArc(){
  const el=id=>document.getElementById(id);
  if(!el('arc-t')) return;
  const s=Math.floor(ARC.ms/1000);
  el('arc-t').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const inter=ARC.last&&Date.now()-ARC.last<60000;
  el('arc-i').textContent=inter?'Activa':'Sin señal';
  el('arc-c').textContent=ARC.flag?'Revisión':'OK';
  el('arc-s').textContent=ARC.locked?'Duplicada':'Única';
  TIERS.forEach(t=>{el('tb-'+t.k).style.width=Math.min(100,ARC.ms/t.ms*100)+'%';});
  const key=`arc:${state.profile.id}:${ARC.pid}`, paid=!!state.bankOps[key], best=arcBest();
  const b=el('arc-claim');
  b.disabled=paid||!best||!!ARC.flag||ARC.locked;
  b.textContent=paid?'Ya cobrado':best?`Cobrar ${arcAmt()} Pz`:'Cobrar';
  el('arc-msg').textContent=ARC.wait==='load'?'Esperando a que cargue el juego: el contador empieza cuando está listo.':ARC.wait==='tab'?'Contador en pausa: vuelve a esta pestaña y juega para seguir sumando.':ARC.flag?'Ritmo de clic mecánico detectado: la sesión pasa a revisión manual. No es una sanción.'
    :ARC.locked?'Hay otra sesión activa de esta prueba. Cierra la otra pestaña.'
    :'Las Pz se aplican tras la validación. En esta maqueta la validación es simulada.';
}
function arcTick(){
  if(!location.hash.startsWith('#jugar/')) return;
  const pid=location.hash.split('/')[1];
  if(ARC.pid!==pid) arcReset(pid);
  const now=Date.now();
  let lock=null; try{lock=JSON.parse(localStorage.getItem('pj_arc_lock'));}catch(e){}
  ARC.locked=!!(lock&&lock.sid!==ARC.sid&&now-lock.ts<20000);
  if(!ARC.locked){try{localStorage.setItem('pj_arc_lock',JSON.stringify({sid:ARC.sid,ts:now}));}catch(e){}}
  if(document.visibilityState==='visible'&&ARC.last&&now-ARC.last<60000&&!ARC.locked) ARC.ms+=1000;
  if(ARC.clicks.length>=10){
    const c=ARC.clicks.slice(-10), iv=[];
    for(let i=1;i<c.length;i++) iv.push(c[i]-c[i-1]);
    const mean=iv.reduce((a,b)=>a+b,0)/iv.length, sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)**2,0)/iv.length);
    if(mean<120||sd<8) ARC.flag='ritmo';
  }
  updArc();
}

  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.06,rootMargin:'0px 0px -6% 0px'});

}

/* Contador de tiempo: cuenta mientras la pestaña está visible y el usuario interactúa con el juego */
function arcReset(pid){ARC={pid,ms:0,last:Date.now(),lastTick:Date.now(),clicks:[],flag:'',sid:'s'+Math.random().toString(36).slice(2,9),stars:0,rated:false,locked:false,active:false,loaded:false,wait:''};}
function arcTick(){
  if(!location.hash.startsWith('#jugar/')){ARC.lastTick=Date.now();return;}
  const pid=location.hash.split('/')[1];
  if(ARC.pid!==pid) arcReset(pid);
  const now=Date.now();
  if(document.activeElement&&document.activeElement.tagName==='IFRAME') ARC.last=now;
  let lock=null; try{lock=JSON.parse(localStorage.getItem('pj_arc_lock'));}catch(e){}
  ARC.locked=!!(lock&&lock.sid!==ARC.sid&&now-lock.ts<20000);
  if(!ARC.locked){try{localStorage.setItem('pj_arc_lock',JSON.stringify({sid:ARC.sid,ts:now}));}catch(e){}}
  const dt=Math.min(1500,now-(ARC.lastTick||now)); ARC.lastTick=now;
  ARC.wait=!ARC.loaded?'load':(document.visibilityState!=='visible'||!document.hasFocus())?'tab':'';
  ARC.active=!ARC.wait&&!ARC.locked&&(now-ARC.last)<120000;
  if(ARC.active) ARC.ms+=dt;
  if(ARC.clicks.length>=10){
    const c=ARC.clicks.slice(-10), iv=[];
    for(let i=1;i<c.length;i++) iv.push(c[i]-c[i-1]);
    const mean=iv.reduce((a,b)=>a+b,0)/iv.length, sd=Math.sqrt(iv.reduce((a,b)=>a+(b-mean)**2,0)/iv.length);
    if(mean<120||sd<8) ARC.flag='ritmo';
  }
  updArc();
}
function updArc(){
  const el=id=>document.getElementById(id);
  if(!el('arc-t')) return;
  const s=Math.floor(ARC.ms/1000);
  el('arc-t').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  el('arc-i').textContent=ARC.active?'Activa':'Pausada';
  el('arc-c').textContent=ARC.flag?'Revisión':'OK';
  el('arc-s').textContent=ARC.locked?'Duplicada':'Única';
  TIERS.forEach(t=>{el('tb-'+t.k).style.width=Math.min(100,ARC.ms/t.ms*100)+'%';});
  const paid=!!state.bankOps[`arc:${state.profile.id}:${ARC.pid}`], best=arcBest();
  const b=el('arc-claim');
  b.disabled=paid||!best||!!ARC.flag||ARC.locked;
  b.textContent=paid?'Ya cobrado':best?`Cobrar ${arcAmt()} Pz`:'Cobrar';
  el('arc-msg').textContent=ARC.flag?'Ritmo de clic mecánico detectado: la sesión pasa a revisión manual. No es una sanción.'
    :ARC.locked?'Hay otra sesión activa de esta prueba. Cierra la otra pestaña.'
    :'Las Pz se aplican tras la validación. En esta maqueta la validación es simulada.';
}

 tone(f,d=.12,t='sine',v=.07,at=0){if(!this.on)return;try{this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();const c=this.ctx,o=c.createOscillator(),g=c.createGain(),n=c.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d);}catch(e){}},
 click(){this.tone(620,.05,'triangle',.05)},ok(){[523,659,784].forEach((f,i)=>this.tone(f,.16,'sine',.07,i*.09))},
 level(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.08,i*.1))},err(){this.tone(180,.25,'sawtooth',.05)},coin(){this.tone(988,.08,'square',.04);this.tone(1319,.25,'square',.04,.08)}};

function updArc(){
  const el=id=>document.getElementById(id); if(!el('arc-t')) return;
  const s=Math.floor(ARC.ms/1000), mm=String(Math.floor(s/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
  el('arc-t').textContent=mm+':'+ss;
  el('arc-i').textContent=ARC.active?'Activa':'Pausada';
  el('arc-c').textContent=ARC.flag?'Revisión':'OK';
  el('arc-s').textContent=ARC.locked?'Duplicada':'Única';
  const pill=el('arc-pill');pill.textContent=ARC.locked?'Sesión duplicada':ARC.flag?'En revisión':ARC.wait==='load'?'Cargando juego':ARC.wait==='tab'?'Vuelve a la pestaña':ARC.active?'Contando':'En pausa';pill.className='pill'+(ARC.active&&!ARC.flag?' on':'');
  el('ring').classList.toggle('live',!!ARC.active&&!ARC.flag);
  const nx=TIERS.find(t=>ARC.ms<t.ms), last=TIERS[TIERS.length-1], tgt=nx||last;
  el('ring-p').style.strokeDashoffset=339.3*(1-Math.min(1,ARC.ms/tgt.ms));
  el('arc-n').textContent=nx?`faltan ${Math.ceil((nx.ms-ARC.ms)/60000)} min para ${nx.l}`:'¡todos los hitos logrados!';
  ARC.done=ARC.done||{};
  TIERS.forEach(t=>{
    el('tb-'+t.k).style.width=Math.min(100,ARC.ms/t.ms*100)+'%';
    const ok=ARC.ms>=t.ms, row=el('tr-'+t.k);
    row.classList.toggle('done',ok);row.classList.toggle('next',!ok&&nx===t);
    if(ok&&!ARC.done[t.k]){ARC.done[t.k]=1;if(ARC.ms>1500){SFX.level();confetti(35);toast(`¡Hito de ${t.l} conseguido! +${t.pz} Pz`,'ok');}}
  });
  const paid=!!state.bankOps[`arc:${state.profile.id}:${ARC.pid}`], best=arcBest();
  el('arc-est').textContent=arcAmt()+' Pz';
  const b=el('arc-claim');
  b.disabled=paid||!best||!!ARC.flag||ARC.locked;
  b.textContent=paid?'Ya cobrado':best?`Cobrar ${arcAmt()} Pz`:'Cobrar';
  el('arc-msg').textContent=ARC.flag?'Ritmo de clic mecánico detectado: la sesión pasa a revisión manual. No es una sanción.'
    :ARC.locked?'Hay otra sesión activa de esta prueba. Cierra la otra pestaña.'
    :'Las Pz se aplican tras la validación. En esta maqueta la validación es simulada.';
}

/* ===== Anti-OCR (Google Lens): letras con micro-variación + marca de agua trazable ===== */
function ocrScramble(){
  if(!isProt()) return;
  const st=document.querySelector('.qstage'); if(!st) return;
  const t=`${state.profile.name} · ${state.profile.id}`.replace(/[<>&"]/g,'');
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='260' height='130'><text x='10' y='80' transform='rotate(-22 130 65)' font-family='sans-serif' font-size='13' font-weight='700' fill='rgba(255,255,255,.22)'>${t}</text></svg>`;
  st.style.setProperty('--wmt',JSON.stringify(t));
  st.style.setProperty('--wmk',`url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
  const w=document.createTreeWalker(st,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE|TEXTAREA|SELECT|OPTION)$/.test(n.parentNode.nodeName)||!n.nodeValue.trim()||n.parentNode.closest('.ocw')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const txt=n.nodeValue, host=n.parentNode, f=document.createDocumentFragment();
    if(host.getAttribute&&!host.getAttribute('aria-label')&&host.children.length===0) host.setAttribute('aria-label',txt.trim());
    txt.split(/(\s+)/).forEach(p=>{
      if(!p) return;
      if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(' '));return;}
      const ws=document.createElement('span');ws.className='ocw';ws.setAttribute('aria-hidden','true');
      [...p].forEach(ch=>{const c=document.createElement('span');c.className='occ';c.textContent=ch;
        c.style.transform=`translateY(${(Math.random()*2.4-1.2).toFixed(1)}px) rotate(${(Math.random()*5-2.5).toFixed(1)}deg)`;
        c.style.letterSpacing=(Math.random()*.9-.2).toFixed(1)+'px';ws.appendChild(c);});
      f.appendChild(ws);
    });
    host.replaceChild(f,n);
  });
}

function home(){

  const next=TESTS.find(t=>!isDone(t.id)), nd=doneTests();
  const fecha=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return `<header class="hm-h"><div><p class="eyebrow">${fecha}</p><h1 class="hm-t">${sal}, <span>${esc(state.profile.name)}</span>.</h1>

/* ===== Integridad de los tests: señales de ayuda externa (IA) → revisión manual, no sanción ===== */
const INT={};
const intOf=id=>INT[id]=INT[id]||{away:0,long:0,shots:0,t0:Date.now(),log:[],times:{},cur:null,qt:0};
let AWAY=null;
const awayStart=()=>{const m=location.hash.match(/^#test\/(.+)/);if(m&&!results[m[1]]&&!AWAY) AWAY={id:m[1],t:Date.now()};};
const awayEnd=()=>{if(!AWAY) return;const i=intOf(AWAY.id),d=Date.now()-AWAY.t;if(d>400){i.away++;lg(AWAY.id,'away',{ms:d,t:AWAY.t});}if(d>2500)i.long++;AWAY=null;};
window.addEventListener('blur',awayStart);window.addEventListener('focus',awayEnd);
document.addEventListener('visibilitychange',()=>document.hidden?awayStart():awayEnd());
const _bn=blurNow;blurNow=function(){const m=location.hash.match(/^#test\/(.+)/);if(m){intOf(m[1]).shots++;lg(m[1],'shot',{});}_bn();};
const _sub=submit;
submit=function(aid){
  const a=testById(aid),d=draft[aid]||[];
  if(!a||!a.q.every((q,i)=>isFilled(q,d[i]))) return _sub(aid);
  const i=intOf(aid),avg=(Date.now()-i.t0)/a.q.length/1000,flags=[];
  if(i.long>=2) flags.push('salidas largas de la pestaña');
  if(i.shots>=1) flags.push('intento de captura');
  if(avg<2.5) flags.push('respuestas demasiado rápidas');
  const ok=a.q.filter((q,k)=>isCorrect(q,d[k])).length,passed=ok>=a.pass;
  if(flags.length&&passed&&!isDone(aid)){
    state.claims[aid]={status:'review',flags,at:Date.now(),ok,total:a.q.length,min:a.min,title:a.title,ev:buildEv(aid,a,d,avg,flags)};
    results[aid]={ok,total:a.q.length,passed,reward:{t:'Tu intento ha pasado a revisión manual y las Pz se abonarán al validarlo. No es una sanción: ocurre cuando se detectan señales de ayuda externa (salir de la pestaña, capturas o respuestas muy rápidas).',cls:'wn'}};
    save();toast('Intento en revisión manual','wn');render();return;
  }
  _sub(aid);
};
function retry(aid){
  state.att=state.att||{};state.att[aid]=(state.att[aid]||0)+1;
  delete results[aid];delete draft[aid];delete STEP[aid];delete INT[aid];
  Object.keys(CHK).forEach(k=>{if(k.startsWith(aid+':')) delete CHK[k];});
  save();render();
}
const _tvI=testView;
testView=function(id){
  const h=_tvI(id);
  if(results[id]||!state.profile||!state.profile.member||!testById(id)) return h;
  intOf(id);
  return h.replace('<div class="qbar">',`<div class="note" style="margin-bottom:14px">${ico('shield',16)} Responde tú, sin ayuda de IA. Cada intento mezcla preguntas y opciones, y los intentos con señales de ayuda externa pasan a revisión manual.</div><div class="qbar">`);
};


/* ===== Registro de evidencias y cola de revisión (administración) ===== */
function lg(id,type,extra){const i=intOf(id);if(i.log.length>400) return;i.log.push({t:Date.now(),type,...extra});}
['paste','copy','cut'].forEach(ev=>document.addEventListener(ev,()=>{const m=location.hash.match(/^#test\/(.+)/);if(m&&!results[m[1]]) lg(m[1],'paste',{k:ev});},true));
const _ans=answer;
answer=function(aid,qi,val){const i=INT[aid];
  if(i&&!results[aid]){const last=i.log[i.log.length-1],now=Date.now();
    if(!(last&&last.type==='answer'&&last.q===qi&&now-last.t<1200)) lg(aid,'answer',{q:qi,ms:now-(i.qt||now)});}
  _ans(aid,qi,val);};
const _chk=chk;chk=function(aid,i){if(INT[aid]) lg(aid,'check',{q:i});_chk(aid,i);};
const _tvJ=testView;
testView=function(id){
  const a=testById(id);
  if(a&&state.profile&&state.profile.member&&!results[id]){
    const i=intOf(id),cur=Math.min(STEP[id]||0,a.q.length-1),now=Date.now();
    if(i.cur!==cur){if(i.cur!=null) i.times[i.cur]=(i.times[i.cur]||0)+(now-i.qt);i.cur=cur;i.qt=now;lg(id,'view',{q:cur});}
  }
  return _tvJ(id);
};
function buildEv(aid,a,d,avg,flags){
  const i=intOf(aid),now=Date.now();
  if(i.cur!=null) i.times[i.cur]=(i.times[i.cur]||0)+(now-i.qt);
  return {t0:i.t0,t1:now,avg:+avg.toFixed(1),flags,log:i.log.slice(),
    perQ:a.q.map((q,k)=>({q:q.t.slice(0,80),ms:i.times[k]||0,ok:isCorrect(q,d[k])})),
    ua:navigator.userAgent,vp:innerWidth+'×'+innerHeight,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,lang:navigator.language};
}
const TT=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function reviewCard(aid,c){
  const e=c.ev; if(!e) return '';
  const aw=e.log.filter(x=>x.type==='away'),long=aw.filter(x=>x.ms>2500),totAway=aw.reduce((s,x)=>s+x.ms,0);
  const shots=e.log.filter(x=>x.type==='shot').length,pastes=e.log.filter(x=>x.type==='paste').length;
  let post=0,postOk=0;
  e.log.filter(x=>x.type==='answer').forEach(x=>{
    if(long.some(a=>a.t+a.ms<=x.t&&x.t-(a.t+a.ms)<8000)){post++;if(e.perQ[x.q]&&e.perQ[x.q].ok) postOk++;}});
  const pts=(post>=2&&postOk>=2?2:0)+(long.length>=2?1:0)+(shots?1:0)+(e.avg<2.5?1:0);
  const lvl=pts>=3?['Altos','dg']:pts===2?['Medios','wn']:['Bajos','ok'];
  const sum=[
    `Duración total del intento: <b>${TT(e.t1-e.t0)}</b> · media de <b>${String(e.avg).replace('.',',')} s</b> por pregunta.`,
    aw.length?`Salió de la pestaña <b>${aw.length}</b> veces (${long.length} de más de 2,5 s; ${TT(totAway)} en total).`:'No salió de la pestaña.',
    post?`<b>${post}</b> respuestas se dieron en los 8 s siguientes a una salida larga (<b>${postOk}</b> correctas).`:'Ninguna respuesta tras una salida larga.',
    shots?`<b>${shots}</b> intento(s) de captura de pantalla.`:'Sin intentos de captura.',
    pastes?`<b>${pastes}</b> intento(s) de copiar o pegar.`:'Sin copiar ni pegar.'];
  const NAME={view:x=>`Abre la pregunta ${x.q+1}`,answer:x=>`Responde la pregunta ${x.q+1} (${TT(x.ms)} tras abrirla)`,away:x=>`Sale de la pestaña durante ${TT(x.ms)}`,shot:()=>'Intento de captura de pantalla',paste:x=>`Intento de ${x.k==='paste'?'pegar':'copiar'}`,check:x=>`Pulsa «Comprobar» en la pregunta ${x.q+1}`};
  const tl=e.log.slice().sort((a,b)=>a.t-b.t).map(x=>`<li><span>+${TT(x.t-e.t0)}</span>${(NAME[x.type]||(()=>x.type))(x)}</li>`).join('');
  return `<article class="card rvc"><div class="row"><div><b>${esc(c.title)}</b><div class="small">${c.ok} de ${c.total} correctas · ${c.min} Pz en juego · ${new Date(c.at).toLocaleString('es-ES')}</div></div>${pill('Indicios '+lvl[0],lvl[1])}</div>
    <ul class="rvs">${sum.map(x=>`<li>${x}</li>`).join('')}</ul>
    <details><summary>Cronología completa (${e.log.length} eventos)</summary><ol class="rvt">${tl}</ol></details>
    <details><summary>Tiempo y resultado por pregunta</summary><div class="rvq">${e.perQ.map((p,k)=>`<div><span>${k+1}</span><i>${esc(p.q)}</i><b>${TT(p.ms)}</b>${p.ok?pill('Correcta','ok'):pill('Incorrecta','dg')}</div>`).join('')}</div></details>
    <details><summary>Datos técnicos</summary><p class="small">${esc(e.ua)}<br>Ventana ${e.vp} · ${esc(e.tz)} · ${esc(e.lang)}</p></details>
    <p class="small">Son indicios técnicos registrados en el navegador, no una prueba. La decisión es tuya.</p>
    <div class="acts2"><button class="btn g sm" onclick="reviewDecide('${aid}',true)">Aprobar y abonar ${c.min} Pz</button><button class="btn danger sm" onclick="reviewDecide('${aid}',false)">Rechazar</button></div></article>`;
}
function reviewQueue(){
  const L=Object.entries(state.claims||{}).filter(([,c])=>c&&c.status==='review');
  return sec('Revisiones pendientes')+(L.length?L.map(([id,c])=>reviewCard(id,c)).join(''):'<div class="card small">No hay intentos pendientes de revisión.</div>');
}
function reviewDecide(aid,ok){
  const c=state.claims[aid]; if(!c||c.status!=='review') return;
  if(ok){const r=bank('credit','act:'+state.profile.id+':'+aid,c.min,'Test (revisado): '+c.title);
    state.claims[aid]={status:'confirmed',ref:r.ref,amount:c.min};toast(`Aprobado: +${c.min} Pz abonadas`,'ok');}
  else{state.claims[aid]={status:'rejected',at:Date.now(),title:c.title};toast('Intento rechazado: la persona puede repetir el test.','wn');}
  save();render();
}
const _admR=admin;admin=function(){return reviewQueue()+_admR();};

function levelsHtml(tid,ts,ok){
  const nextT=ts.find(t=>ok(t.lvl)&&!isDone(t.id)),LVN=['I','II','III'];
  return sec('Niveles',`<span class="small">${ts.filter(t=>isDone(t.id)).length} / ${ts.length} tests</span>`)
  +[1,2,3].map(l=>{
    const list=ts.filter(t=>t.lvl===l); if(!list.length) return '';
    const d=list.filter(t=>isDone(t.id)).length,un=ok(l),pct=Math.round(d/list.length*100);
    return `<section class="lvl${un?'':' lock'}${d===list.length?' full':''}"><header><span class="lvn">${un?ico(['star','bolt','trophy'][l-1],20):ico('lock',18)}</span><div><b>Nivel ${LVN[l-1]}</b><small>${un?`${d} / ${list.length} completados`:'Completa 3 tests del nivel anterior para desbloquearlo'}</small></div><div class="bar"><i style="width:${pct}%"></i></div></header>
    ${un?`<div class="lvg">${list.map((t,k)=>{const dn=isDone(t.id);return `<button class="lt${dn?' ok':''}${nextT&&nextT.id===t.id?' nx':''}" onclick="go('test/${t.id}')" title="${esc(t.title)} · +${t.min} Pz" aria-label="Test ${k+1}: ${esc(t.title)}${dn?' (cobrado)':''}">${dn?ico('check',16):k+1}</button>`;}).join('')}</div>`:''}</section>`;
  }).join('')+`<p class="small">Pasa el ratón por un número para ver el test. El resaltado es el siguiente recomendado.</p>`;
}

/* ===== Sonidos más sutiles (senoidales, filtradas, volumen bajo) ===== */
SFX.vol=.5;
SFX.tone=function(f,d=.12,t,v=.03,at=0){
  if(!this.on) return;
  try{this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();
    const c=this.ctx,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter(),n=c.currentTime+at,pk=Math.min(v,.04)*this.vol;
    o.type='sine';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=2200;
    g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(pk,n+.014);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.03);}catch(e){}};
SFX.click=function(){this.tone(500,.05,'sine',.018)};
SFX.ok=function(){[523,659].forEach((f,i)=>this.tone(f,.2,'sine',.03,i*.08))};
SFX.level=function(){[523,659,784].forEach((f,i)=>this.tone(f,.3,'sine',.035,i*.11))};
SFX.err=function(){this.tone(230,.14,'sine',.026);this.tone(190,.2,'sine',.026,.09)};
SFX.coin=function(){this.tone(880,.1,'sine',.028);this.tone(1175,.24,'sine',.028,.07)};

});

const KT=i=>.1+i*.16, KEX=.74;
const vFrac=(L,idx)=>Math.max(0,Math.min(1,(VID.t-vStart(L,idx))/VD(L.scenes[idx])));
function sceneHtml(L,idx){
  const s=L.scenes[idx],fr=vFrac(L,idx),on=a=>fr>=a?' on':'';
  const items=s.bars?s.bars.map((b,i)=>`<div class="kp kb${on(KT(i))}" data-at="${KT(i)}"><span class="kbl">${esc(b.l)}</span><div class="kbt"><i style="--w:${(b.p/(s.max||100)*100).toFixed(1)}%"></i></div><b>${b.t||b.p+' %'}</b></div>`).join('')
    :(s.kp||[]).map((t,i)=>`<div class="kp kc${on(KT(i))}" data-at="${KT(i)}"><span class="kck">${ico('check',16)}</span><span>${esc(t)}</span></div>`).join('');
  return `<div class="vs v2" style="--c:${L.color}"><i class="orb a"></i><i class="orb b"></i>
   <div class="v2h"><span class="v2n">Paso ${idx+1} de ${L.scenes.length}</span><span class="v2d">${L.scenes.map((_,k)=>`<i${k===idx?' class="on"':''}></i>`).join('')}</span></div>
   <div class="v2m"><div class="v2l"><div class="vicon">${ico(s.i,44)}</div><div class="vst">${esc(s.t)}</div></div><div class="v2r">${items}</div></div>
   ${s.ex?`<div class="v2e kp${on(KEX)}" data-at="${KEX}"><b>Ejemplo</b>${esc(s.ex)}</div>`:''}</div>`;
}

 {i:'check',t:'Cada residuo, a su contenedor',x:'Cada contenedor tiene su color y su función. Separar bien los residuos hace posible reciclarlos; un envase sucio o mal depositado puede estropear toda una partida.',kp:['Amarillo: envases, latas y briks','Azul: papel y cartón','Verde: vidrio, sin tapones','Marrón: restos orgánicos'],ex:'Un tarro de cristal va al verde; su tapa metálica, al amarillo.'},
 {i:'bolt',t:'Energía renovable',v:'cmp',x:'El sol y el viento son fuentes renovables: no se agotan y emiten muy poco dióxido de carbono. Ahorrar energía en casa también cuenta, porque la que no gastas es la que no hay que producir.',a:{h:'Renovables',l:['Solar','Eólica','Hidráulica']},b:{h:'No renovables',l:['Petróleo','Carbón','Gas natural']},ex:'Desenchufar los cargadores que no usas evita un consumo pequeño pero constante.'},
 {i:'drop',t:'Cuidar el agua',x:'El agua dulce es limitada. Los gestos pequeños suman: cerrar el grifo mientras te cepillas los dientes, ducharte en menos tiempo y arreglar las fugas, que pueden desperdiciar muchos litros al día.',kp:['Cierra el grifo al cepillarte','Duchas cortas','Repara goteos y fugas'],ex:'Un grifo que gotea puede perder decenas de litros al día.'},
 {i:'check',t:'Ponte a prueba',v:'quiz',q:'¿Dónde va un tarro de cristal vacío?',o:['Contenedor amarillo','Contenedor verde','Contenedor azul'],c:1,x:'Ponte a prueba. ¿Dónde va un tarro de cristal vacío? La respuesta correcta es la segunda: el contenedor verde, que es el del vidrio. La tapa metálica va al amarillo.',ex:'Verde: vidrio. Azul: papel. Amarillo: envases.'}],
vid:[
 {i:'gamepad',t:'Lo que vas a aprender',v:'intro',x:'En esta lección verás qué es un estudio indie, quién hace cada cosa en un juego, cómo dar una buena opinión y cómo leer la clasificación por edades. Al final, una pregunta para comprobarlo.',kp:['Qué es un estudio indie','Quién hace cada cosa','Cómo dar una buena opinión','Cómo leer el PEGI'],ex:'Dura unos dos minutos. Puedes pausar y retroceder cuando quieras.'},
 {i:'gamepad',t:'Qué es un estudio indie',x:'Un estudio indie crea videojuegos de forma independiente, casi siempre con un equipo pequeño y sin una gran compañía detrás. Eso les da libertad creativa para probar ideas distintas.',kp:['Equipos pequeños','Libertad creativa','Ideas más arriesgadas'],ex:'Muchos juegos indie los hace una sola persona o un grupo de amigos.'},
 {i:'handshake',t:'Estudio y editor',v:'cmp',x:'El estudio es quien crea el juego. El editor lo financia, lo publica y se encarga de darlo a conocer. Algunos estudios publican ellos mismos y otros trabajan con un editor.',a:{h:'Estudio',l:['Diseña el juego','Programa y crea el arte','Hace el juego']},b:{h:'Editor',l:['Financia el proyecto','Publica y distribuye','Da a conocer el juego']},ex:'Fíjate en quién firma cada juego: es una buena pista de su origen.'},
 {i:'star',t:'Opiniones honestas',v:'cmp',x:'Una opinión útil es sincera y explica el porqué. No tiene que ser positiva: ayuda a otros jugadores a decidir y al estudio a mejorar. Evita los insultos y no cuentes el final.',a:{h:'Útil',l:['Sincera','Explica el porqué','Habla del juego']},b:{h:'Evita',l:['Insultos','Spoilers','Solo «me gusta»']},ex:'«Los controles responden bien, pero el final se me hizo corto» ayuda más que «me gusta».'},
 {i:'shield',t:'Clasificación PEGI',x:'PEGI es el sistema europeo de clasificación por edades: 3, 7, 12, 16 y 18 años. Además de la edad, los iconos avisan de violencia, lenguaje soez, miedo u otros contenidos. Revísalo antes de jugar.',kp:['La cifra indica la edad mínima','Los iconos avisan del tipo de contenido','Compruébalo antes de jugar o canjear'],ex:'Un juego PEGI 16 está pensado para mayores de 16 años.'},
 {i:'star',t:'Ponte a prueba',v:'quiz',q:'Un juego tiene PEGI 16. ¿Qué significa?',o:['Dura 16 horas','Es para mayores de 16 años','Cuesta 16 euros'],c:1,x:'Ponte a prueba. Un juego tiene PEGI dieciséis. ¿Qué significa? La respuesta correcta es la segunda: está pensado para mayores de dieciséis años.',ex:'PEGI = edad recomendada, no duración ni precio.'}]

Object.keys(LS).forEach(k=>{if(LESSONS[k]) LESSONS[k].scenes=LS[k];});
LMAP.trend='trending-up';
function sceneHtml(L,idx){
  const s=L.scenes[idx],fr=vFrac(L,idx),on=a=>fr>=a?' on':'';
  const K=(c,h,i,x='')=>`<div class="kp ${c}${on(KT(i))}" data-at="${KT(i)}"${x}>${h}</div>`;
  const ul=(a,ic)=>`<ul class="ic">${a.map(t=>`<li>${lic(ic||iconFor(t),14)}<span>${esc(t)}</span></li>`).join('')}</ul>`;
  let items='',cls='v2r',mcls='v2m';
  if(s.bars){items=s.bars.map((b,i)=>K('kb',`<span class="kbl">${esc(b.l)}</span><div class="kbt"><i style="--w:${(b.p/(s.max||100)*100).toFixed(1)}%"></i></div><b>${b.t||b.p+' %'}</b>`,i)).join('');}
  else if(s.v==='cmp'){cls+=' two';items=[s.a,s.b].map((c,i)=>K('cm '+(i?'good':'bad'),`<h4>${ico(i?'check':'alert',18)} ${esc(c.h)}</h4>${ul(c.l,i?'check':'x')}`,i*2)).join('');}
  else if(s.v==='flow'){cls+=' three';mcls+=' wide';items=s.f.map((c,i)=>K('cm fl',`<h4>${esc(c.h)}</h4>${ul(c.l)}`,i*2)).join('');}
  else if(s.v==='steps'){items=s.kp.map((t,i)=>K('kc',`<span class="kck">${i+1}</span><span>${esc(t)}</span>`,i)).join('');}
  else if(s.v==='quiz'){items=`<div class="qq">${esc(s.q)}</div>`+s.o.map((t,i)=>K('qo'+(fr>=KEX&&i===s.c?' win':''),`<b>${'ABC'[i]}</b><span>${esc(t)}</span>`,i,` data-w="${i===s.c?1:0}"`)).join('');}
  else{items=(s.kp||[]).map((t,i)=>K('kc',`<span class="kck">${lic(iconFor(t),18)}</span><span>${esc(t)}</span>`,i)).join('');}
  return `<div class="vs v2" style="--c:${L.color}"><i class="orb a"></i><i class="orb b"></i>
   <div class="v2h"><span class="v2n">${s.v==='intro'?'Introducción':s.v==='quiz'?'Comprobación':`Paso ${idx} de ${L.scenes.length-2}`}</span><span class="v2d">${L.scenes.map((_,k)=>`<i${k===idx?' class="on"':''}></i>`).join('')}</span></div>
   <div class="${mcls}"><div class="v2l"><div class="vicon">${ico(s.i,44)}</div><div class="vst">${esc(s.t)}</div></div><div class="${cls}">${items}</div></div>
   ${s.ex?`<div class="v2e kp${on(KEX)}" data-at="${KEX}"><b>${lic(s.v==='quiz'?'check-circle-2':'lightbulb',14)} ${s.v==='quiz'?'Respuesta':'Ejemplo'}</b>${esc(s.ex)}</div>`:''}</div>`;
}
