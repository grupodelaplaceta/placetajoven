const NP_TXT='Placeta Joven no tiene ánimo de lucro: de cada pago, una vez descontada la comisión de la plataforma de pago, todo va al Grupo de la Placeta y a sus proyectos.';
const DON_TXT='Las claves de código son donadas por estudios y personas colaboradoras: no se compran con el dinero de las cuotas.';
/* Planes = acceso a la plataforma. Joven Key y Joven Play = modalidades de juego */
const PLANS={
 mensual:{n:'Plan Mensual',price:'2,99',per:'mes',tag:'Mes a mes',note:'35,88 € al año pagando cada mes',desc:'Acceso completo a la plataforma pagando mes a mes.',ft:['Todas las lecciones, tests y cursos','Canje de videojuegos con tus Pz','Cursos que te dan Pz','Accesibilidad y pictogramas']},
 anual:{n:'Plan Anual',price:'15',per:'año',tag:'Ahorras un 58 %',note:'Equivale a 1,25 € al mes',desc:'El mismo acceso por mucho menos: un solo pago al año.',ft:['Todo lo del Plan Mensual','Ahorras 20,88 € al año frente al plan mensual','Un solo pago al año']}};
const MOD={key:{n:'Joven Key',i:'key',d:'Juegos que te dan su clave de código. Las claves son donadas.'},play:{n:'Joven Play',i:'gamepad',d:'Juegos que te dan Pz por jugar, online o en Windows.'}};
const hasPlan=()=>!!(state.profile&&state.profile.member);
const planLabel=p=>{const L=Object.keys(PLANS).filter(k=>p.plans&&p.plans[k]).map(k=>PLANS[k].n);return L.length?L.join(' + ')+(p.expires?' · hasta '+p.expires:''):(p.member?'Plan activo':'Sin plan');};
function activate(k){
  if(!k||!PLANS[k]) return go('planes');
  const dt=new Date();PLANS[k].per==='mes'?dt.setMonth(dt.getMonth()+1):dt.setFullYear(dt.getFullYear()+1);const d=dt.toISOString().slice(0,10);
  state.profile.plans=Object.assign({},state.profile.plans,{[k]:true});state.profile.member=true;state.profile.expires=d;save();
  toast(PLANS[k].n+' activado hasta '+d+' (pago simulado).','ok');render();
}
const planCard=(k,cta)=>{const P=PLANS[k];return `<article class="card plan${k==='anual'?' hl':''}"><span class="pl-t">${P.tag}</span><h3>${P.n}</h3><div class="pl-p">${P.price} €<small> / ${P.per}</small></div>${P.note?`<small class="pl-n">${P.note}</small>`:''}<p class="small">${P.desc}</p><ul>${P.ft.map(f=>`<li>${ico('check',16)}<span>${f}</span></li>`).join('')}</ul>${cta}</article>`;};
const npStrip=()=>`<section class="np"><div class="lp-w"><img class="np-logo" src="${LOGO_GP}" alt="Grupo de la Placeta"><div><b>Sin ánimo de lucro</b><p>${NP_TXT}</p></div></div></section>`;
const modsSection=()=>`<section class="lp-s" id="lp-mod"><div class="lp-w"><h2>Dos modalidades de juego</h2><div class="plans">${['key','play'].map(k=>`<article class="card mod ${k}"><span class="mi">${ico(MOD[k].i,26)}</span><h3>${MOD[k].n}</h3><p>${MOD[k].d}</p></article>`).join('')}</div><p class="np-line">${ico('gift',16)} ${DON_TXT}</p></div></section>`;
const fundsCard=()=>`<div class="card funds"><img src="${LOGO_GP}" alt="Grupo de la Placeta"><div><h2>Adónde va el dinero</h2><div class="flow3"><div><b>Tu pago</b>Cuota de la plataforma</div><i class="ar">→</i><div><b>Plataforma de pago</b>Cobra su comisión</div><i class="ar">→</i><div class="fin"><b>Grupo de la Placeta</b>El resto, para sus proyectos</div></div><ul><li>${ico('check',16)}<span>Una parte de cada cobro se la queda la plataforma de pago como comisión. Placeta Joven no se lleva nada.</span></li><li>${ico('check',16)}<span>El resto va al Grupo de la Placeta y a sus proyectos.</span></li><li>${ico('check',16)}<span>${DON_TXT}</span></li><li>${ico('check',16)}<span>Los Pz son puntos de la plataforma: no son dinero.</span></li></ul><a class="lk" onclick="go('legal/fondos')">Más información</a></div></div>`;
const landingPlans=()=>`${coursesLanding()}<section class="lp-s" id="lp-precio"><div class="lp-w"><h2>Elige tu plan de la plataforma</h2><p class="lead">El mismo acceso en los dos. Pagando al año ahorras un 58 %.</p><div class="plans">${['mensual','anual'].map(k=>planCard(k,`<button class="btn blk" onclick="lpGo('registro')">Crear cuenta y elegir</button>`)).join('')}</div></div></section><section class="lp-s" id="lp-fondos"><div class="lp-w">${fundsCard()}</div></section>`;
function plansView(){
  return hd('Planes','El mismo acceso en los dos. Pagando al año ahorras un 58 %.')
  +`<div class="plans">${['mensual','anual'].map(k=>planCard(k,hasPlan()&&state.profile.plans&&state.profile.plans[k]?`<button class="btn ghost blk" disabled>Activo${state.profile.expires?' hasta '+state.profile.expires:''}</button>`:`<button class="btn g blk" onclick="activate('${k}')">Activar ${PLANS[k].n} · ${PLANS[k].price} €/${PLANS[k].per}</button>`)).join('')}</div>
  <div style="margin-top:20px;max-width:780px">${fundsCard()}</div><p class="small">Versión de demostración: el pago está simulado.</p>`;
}
LEGAL.terminos=['Términos y condiciones',`<p>Al registrarte y usar Placeta Joven aceptas estos términos. Si tienes menos de 14 años necesitas el consentimiento verificable de tu madre, padre o tutor.</p>
<h2>1. Quiénes somos</h2><p>Placeta Joven es un proyecto del Grupo de la Placeta, sin ánimo de lucro. De cada pago, una vez descontada la comisión de la plataforma de pago, todo se destina al Grupo de la Placeta y a sus proyectos.</p>
<h2>2. Planes de la plataforma</h2><p>El acceso a la plataforma se contrata con un plan: Plan Mensual (2,99 € al mes) o Plan Anual (15 € al año). Ambos dan el mismo acceso; el plan anual sale más barato: equivale a 1,25 € al mes, frente a 35,88 € al año pagando mes a mes. Los precios incluyen los impuestos aplicables.</p>
<h2>3. Modalidades de juego</h2><p><b>Joven Key</b>: juegos que te dan su clave de código. <b>Joven Play</b>: juegos que te dan Pz por jugar, online o en Windows. Las dos modalidades están incluidas en cualquier plan.</p>
<h2>4. Claves donadas</h2><p>Las claves de código son donadas por estudios y personas colaboradoras. Se entregan sujetas a disponibilidad, no tienen valor en dinero, no son reembolsables ni transferibles y su uso se rige por las condiciones de la tienda de destino. No garantizamos su compatibilidad con tu dispositivo.</p>
<h2>5. Pz</h2><p>Las Pz son una puntuación interna de la plataforma: no son dinero, no son un instrumento financiero y no pueden cambiarse por dinero.</p>
<h2>6. Tiempo de juego</h2><p>En Joven Play online, el tiempo solo cuenta mientras la pestaña del juego está activa y visible y el juego ha cargado. En Windows, solo mientras la app detecta el juego abierto, en primer plano y con actividad. Solo se permite una sesión a la vez y las sesiones pueden pasar a revisión manual.</p>
<h2>7. Conducta y ayuda externa</h2><p>Está prohibido usar autoclickers, scripts o varias sesiones, y resolver los tests con inteligencia artificial, buscadores visuales, capturas de pantalla o terceras personas. Los intentos con señales de ayuda externa pasan a revisión manual y, si se confirma, se pueden anular las Pz asociadas.</p>
<h2>8. Pagos y desistimiento</h2><p>Los pagos son periódicos: mensuales en el Plan Mensual y anuales en el Plan Anual. Puedes solicitar el desistimiento en los plazos y supuestos que prevé la normativa de consumo escribiendo al correo del titular.</p>
<h2>9. Propiedad intelectual y terceros</h2><p>Los contenidos de la plataforma están protegidos. Los juegos pertenecen a sus estudios y cada uno muestra su clasificación PEGI. Los pictogramas son de ARASAAC (Gobierno de Aragón), autor Sergio Palao, licencia CC BY-NC-SA.</p>
<h2>10. Responsabilidad y ley aplicable</h2><p>El servicio se presta «tal cual». Estos términos se rigen por la ley española y, en consumo, por los derechos irrenunciables de tu país de residencia.</p>
<p class="small">Texto informativo: debe completarse con los datos reales del titular y revisarlo un profesional jurídico antes de publicar.</p>`];
LEGAL.fondos=['Fondos y claves donadas',`<p>Placeta Joven es un proyecto sin ánimo de lucro del Grupo de la Placeta.</p>
<h2>Adónde van los fondos</h2><p>Cada pago pasa por una plataforma de pago ([nombre de la pasarela]) que cobra una comisión por el cobro. Descontada esa comisión (y los impuestos que correspondan), todo lo recaudado se destina al Grupo de la Placeta y a sus proyectos. [Aquí puedes detallar los proyectos y, si procede, enlazar las cuentas anuales.]</p>
<h2>Claves donadas</h2><p>Las claves de código que se canjean con Pz son donadas por estudios y personas colaboradoras. No se compran con el dinero de las cuotas, no tienen valor en dinero y se entregan según disponibilidad.</p>
<h2>Cómo donar claves</h2><p>Si eres estudio o persona creadora y quieres donar claves, escríbenos a [correo de contacto].</p>`];

const PICC=(()=>{try{return JSON.parse(localStorage.getItem('pj_pic')||'{}');}catch(e){return {};}})(),PICQ={};
const sing=w=>w.length>5&&w.endsWith('es')?w.slice(0,-2):w.length>4&&w.endsWith('s')?w.slice(0,-1):w;
async function picUrl(t){
  t=t.toLowerCase();if(t in PICC) return PICC[t];if(PICQ[t]) return PICQ[t];
  return PICQ[t]=(async()=>{
    for(const q of [t,sing(t)]){try{
      const r=await fetch('https://api.arasaac.org/v1/pictograms/es/bestsearch/'+encodeURIComponent(q));
      if(!r.ok) continue;const j=await r.json(),id=j&&j[0]&&j[0]._id;
      if(id){const u=`https://static.arasaac.org/pictograms/${id}/${id}_300.png`;PICC[t]=u;try{localStorage.setItem('pj_pic',JSON.stringify(PICC));}catch(e){}return u;}
    }catch(e){return null;}}
    return null;})();
}
const STOP=new Set('que cuál cuáles cuánto cuántos cuántas como cómo para esta este estos estas entre sobre desde hasta dónde donde tiene tienen hace hacer puedes debes antes después todos todas siempre nunca mismo cuando porque pero también solo cada algo muy otra otro otros otras ante tras según opción respuesta correcta verdadero falso afirmación frase sigue siguiente siguientes'.split(' '));
const kw=(t,n)=>{const o=[];(t||'').toLowerCase().replace(/[^a-záéíóúüñ\s]/g,' ').split(/\s+/).forEach(w=>{if(w.length>=4&&!STOP.has(w)&&!o.includes(w)&&o.length<n) o.push(w);});return o;};
const TPIC={ciber:'ordenador',fin:'dinero',mat:'matemáticas',cie:'ciencia',med:'reciclaje',vid:'videojuego'};
async function picImg(term,cls){const u=await picUrl(term);if(!u) return null;const im=new Image();im.src=u;im.alt=term;im.className='pic '+cls;im.loading='lazy';return im;}

async function scanNow(){
  if(A.pic){
    document.querySelectorAll('.tt:not([data-picd])').forEach(async e=>{e.dataset.picd=1;const m=(e.getAttribute('onclick')||'').match(/tema\/(\w+)/),t=m&&TPIC[m[1]];
      if(t){const im=await picImg(t,'pic-m'),h=e.querySelector('.tt-top');if(im&&h) h.insertBefore(im,h.lastElementChild);}});
    document.querySelectorAll('.qstage:not([data-picd])').forEach(async st=>{st.dataset.picd=1;
      const w=kw(st.innerText.slice(0,200),5);if(!w.length) return;
      const strip=document.createElement('div');strip.className='picstrip';strip.setAttribute('aria-hidden','true');
      for(const x of w){const im=await picImg(x,'pic-s');if(im){const f=document.createElement('figure');f.append(im,Object.assign(document.createElement('figcaption'),{textContent:x}));strip.append(f);}}
      if(strip.children.length&&st.isConnected) st.prepend(strip);});
    document.querySelectorAll('.vs.v2:not([data-picd])').forEach(async s=>{s.dataset.picd=1;
      const h=s.querySelector('.vst'),t=h&&kw(h.textContent,1)[0];
      if(t){const im=await picImg(t,'pic-l');if(im&&h.isConnected) h.after(im);}
      s.querySelectorAll('.kc:not([data-picd])').forEach(async k=>{k.dataset.picd=1;const w=kw(k.textContent,1)[0];if(!w) return;const im=await picImg(w,'pic-k');if(im&&k.isConnected) k.insertBefore(im,k.children[1]||null);});});
    document.querySelectorAll('.vs.v2 .kc:not([data-picd])').forEach(async k=>{k.dataset.picd=1;const w=kw(k.textContent,1)[0];if(!w) return;const im=await picImg(w,'pic-k');if(im&&k.isConnected) k.insertBefore(im,k.children[1]||null);});

  const X=q?TESTS.filter(t=>nz(t.title).includes(q)).slice(0,5).map(t=>({k:'Test',t:t.title,s:'+'+t.min+' Pz',i:'check',go:'test/'+t.id})):[];
  return out.concat(G,C,T,X);
}
function srcRun(q){
  SRC.items=srcItems(q);SRC.i=0;const r=document.getElementById('src-r');if(!r) return;
  r.innerHTML=SRC.items.length?SRC.items.map((x,i)=>`<button class="src-i${i===0?' on':''}" data-i="${i}" onclick="srcGo(${i})"><span class="src-ic">${ico(x.i,18)}</span><span class="src-t"><b>${esc(x.t)}</b><small>${esc(x.s||'')}</small></span><em>${x.k}</em></button>`).join(''):`<p class="src-e">Sin resultados para «${esc(q)}».</p>`;
  paintIcons();
}
function srcGo(i){const x=SRC.items[i];if(!x) return;srcClose();go(x.go);}
function srcKey(e){
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=SRC.items.length;if(!n) return;SRC.i=(SRC.i+(e.key==='ArrowDown'?1:n-1))%n;document.querySelectorAll('.src-i').forEach((b,k)=>b.classList.toggle('on',k===SRC.i));const b=document.querySelector('.src-i.on');b&&b.scrollIntoView({block:'nearest'});}
  else if(e.key==='Enter'){srcGo(SRC.i);}
}
function srcOpen(){
  if(!state.profile||document.querySelector('.src-ov')) return;
  const o=document.createElement('div');o.className='src-ov';o.onclick=e=>{if(e.target===o) srcClose();};
  o.innerHTML=`<div class="src card" role="dialog" aria-modal="true" aria-label="Buscar"><div class="src-in">${ico('search',20)}<input id="src-q" type="search" placeholder="Busca juegos, cursos, temas o tests…" autocomplete="off" oninput="srcRun(this.value)" onkeydown="srcKey(event)"><button class="ibtn" onclick="srcClose()" aria-label="Cerrar">${ico('close',18)}</button></div><div id="src-r" class="src-r"></div></div>`;
  document.body.appendChild(o);SFX.click();srcRun('');document.getElementById('src-q').focus();
}
function srcClose(){const o=document.querySelector('.src-ov');if(o) o.remove();}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') srcClose();
  const t=e.target&&e.target.tagName;
  if((e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(t))||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();srcOpen();}
});

/* ===== Carruseles horizontales con flechas en escritorio ===== */
function hsInit(){
  document.querySelectorAll('.lp-gg:not([data-hs]),.row-scroll:not([data-hs])').forEach(el=>{
    el.dataset.hs=1;const w=document.createElement('div');w.className='hsw';el.parentNode.insertBefore(w,el);w.appendChild(el);
    ['prev','next'].forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='hs-a '+d;b.setAttribute('aria-label',i?'Siguiente':'Anterior');b.innerHTML=ico('arrow',18);
      b.onclick=()=>el.scrollBy({left:(i?1:-1)*el.clientWidth*.8,behavior:'smooth'});w.appendChild(b);});
  });
}
