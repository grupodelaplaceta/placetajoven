<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificando tu identidad… · Placeta Joven</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="../img/joven.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --deep:#263933; --dark:#10151D; --darker:#0B0F14; --accent:#8ED6C2; --accent2:#E7F06C; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:'Bricolage Grotesque',sans-serif; color:#fff;
      background:radial-gradient(900px 460px at 80% 0%,rgba(142,214,194,.17),transparent 60%),linear-gradient(160deg,#263933 0%,#10151D 65%,#0B0F14 100%); padding:24px; }
    .box { background:#171F27; color:#F1F2E7; border:1px solid rgba(142,214,194,.2); border-radius:8px; padding:2.4rem 2rem; max-width:430px;
      width:100%; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.4); }
    .logo { width:150px; height:104px; object-fit:contain; margin:0 auto 1.1rem; filter:brightness(0) saturate(100%) invert(88%) sepia(28%) saturate(531%) hue-rotate(104deg) brightness(96%) contrast(91%); }
    .spinner { width:44px; height:44px; border:4px solid #eee; border-top-color:var(--accent2);
      border-radius:50%; margin:0 auto 1rem; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    h1 { font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:1.6rem; margin:0 0 .4rem; }
    p { font-size:.95rem; color:#A6B1AA; margin:0 0 1rem; line-height:1.5; }
    .ok { color:#1f8a4c; font-weight:700; }
    .err { color:#c62828; font-weight:700; }
    a.btn { display:inline-block; margin-top:.4rem; background:#E7F06C;
      color:#18211C; text-decoration:none; font-weight:800; padding:.7rem 1.4rem; border-radius:4px; font-size:.95rem; }
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="../img/joven.png" alt="Placeta Joven" />
    <div class="spinner" id="spinner"></div>
    <h1>Verificando tu identidad</h1>
    <p id="status">Conectando con PlacetaID…</p>
    <div id="actions" style="display:none">
      <a class="btn" href="../index.html">Volver a Placeta Joven</a>
    </div>
  </div>

  <script src="../js/placetaid.js?v=20260907b"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || params.get('placetaid_token');
      var userStr = params.get('user');
      var statusEl = document.getElementById('status');
      var actionsEl = document.getElementById('actions');
      var spinner = document.getElementById('spinner');

      function finish(msg, ok) {
        spinner.style.display = 'none';
        statusEl.textContent = msg;
        statusEl.className = ok ? 'ok' : 'err';
        actionsEl.style.display = 'block';
      }

      if (!token || !userStr) {
        finish('No se recibieron datos de autenticación de PlacetaID.', false);
        return;
      }

      try {
        var user = JSON.parse(decodeURIComponent(userStr));
        if (!window.PlacetaJovenAuth) {
          finish('No se pudo cargar el módulo de sesión. Recarga e inténtalo.', false);
          return;
        }
        if (window.PlacetaJovenAuth.storeSession(token, user)) {
          finish('Identidad verificada. Cargando tu Placeta Joven…', true);
          setTimeout(function () { window.location.href = '../mi.html'; }, 600);
        } else {
          finish('No se pudo guardar la sesión en este navegador.', false);
        }
      } catch (e) {
        finish('Error al procesar los datos de PlacetaID.', false);
      }
    })();
  </script>
</body>
</html>
