<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placeta Joven · Cargando tu espacio…</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2A0750" />
  <link rel="icon" type="image/png" href="img/jovenlogo.png" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,#4E1B94 0%,#2A0750 55%,#1F053C 100%);color:#fff}
    .b{text-align:center;padding:24px}
    .l{width:110px;margin:0 auto 1rem}
    .s{width:40px;height:40px;border:4px solid rgba(255,255,255,.25);border-top-color:#C9B8FF;border-radius:50%;margin:0 auto 1.1rem;animation:g 1s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
    p{margin:0;font-size:.95rem;color:#E6DDF9}
    a{color:#C9B8FF;font-weight:700;text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <div class="b">
    <img class="l" src="img/jovenlogo.png" alt="Placeta Joven" />
    <div class="s"></div>
    <p>Abriendo tu espacio joven…</p>
    <p style="margin-top:.6rem"><a href="espacio/inicio.html">Ir a Mi espacio</a></p>
  </div>
  <script>
    // Página de entrada tras PlacetaID: redirige al espacio multipágina real.
    (function () {
      var destino = 'espacio/inicio.html' + window.location.search;
      setTimeout(function () { window.location.replace(destino); }, 350);
    })();
  </script>
</body>
</html>
